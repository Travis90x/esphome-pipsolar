# =====================================================================
# HELTEC WiFi Kit 32 V3 - INVERTER PI30
# Versione: 2026-10-25 18:48
#
# Componente CORE `pipsolar` di ESPHome: nessun external_components, si
# compila con l'add-on ESPHome di Home Assistant senza installare nulla.
#
# NOMI DELLE ENTITÀ. Il nome del dispositivo in Home Assistant è "PI30"
# (friendly_name) e ogni entità ha un nome corto senza ripeterlo, quindi
# gli ID sono tutti "<dominio>.pi30_<nome>":
#   sensor.pi30_battery_voltage, number.pi30_set_battery_recharge_voltage,
#   button.pi30_charger_solar_utility, switch.pi30_output_priority_sbu ...
# Le automazioni, gli script e le dashboard del repository
# (home_assistant/) usano questi ID. Il nome host resta "heltec-inverter",
# così Home Assistant e l'OTA trovano il dispositivo come prima.
#
# Cablaggio: vedi heltec-pi30-display.yaml
# =====================================================================

esphome:
  name: "heltec-inverter"
  friendly_name: PI30

esp32:
  board: heltec_wifi_kit_32_V3
  variant: esp32s3
  framework:
    type: arduino

logger:
  level: DEBUG
  baud_rate: 0

api:
  encryption:
    key: !secret api_key_heltec_v3
  reboot_timeout: 0s

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: 192.168.1.125
    gateway: 192.168.1.1
    subnet: 255.255.255.0
    dns1: 8.8.8.8
    dns2: 192.168.1.1
  power_save_mode: none
  ap:
    ssid: "Heltec-PI30"
    password: !secret wifi_hotspot_password

captive_portal:

time:
  - platform: sntp
    id: sntp_zone_time
    timezone: Europe/Rome

# =====================================================================
# UART E COMPONENTE PIPSOLAR
# =====================================================================

uart:
  - id: uart_0
    tx_pin: GPIO5
    rx_pin: GPIO3
    baud_rate: 2400
    data_bits: 8
    parity: NONE
    stop_bits: 1
    rx_buffer_size: 512
    # Copia il traffico senza sottrarre byte al componente
    # (dummy_receiver: false), per rivedere le risposte che pipsolar non
    # pubblica (QPI, QID, QVFW, QDI, QMCHGCR, QMUCHGCR) e l'ACK/NAK di ogni
    # scrittura. Pubblica solo con "raw frame capture" acceso.
    debug:
      direction: BOTH
      dummy_receiver: false
      after:
        delimiter: "\r"
      sequence:
        - lambda: |-
            if (!id(g_sniff))
              return;
            // Trama = payload + CRC(2) + CR: i byte di CRC sono spesso ASCII
            // stampabili e finirebbero in coda al testo.
            size_t n = bytes.size();
            if (n >= 3 && bytes[n - 1] == 0x0D)
              n -= 3;
            std::string t;
            for (size_t i = 0; i < n; i++)
              if (bytes[i] >= 0x20 && bytes[i] <= 0x7E)
                t += (char) bytes[i];
            if (direction == UART_DIRECTION_TX)
              id(ts_last_tx).publish_state(t);
            else
              id(ts_last_rx).publish_state(t);

pipsolar:
  uart_id: uart_0
  id: inverter0
  # A 2400 baud un giro completo di polling dura circa 1s: ogni 5s la UART
  # resta libera 4s su 5. Il componente è già seriale (comandi in coda con
  # precedenza sui poll), le richieste non si accavallano.
  update_interval: 5s

globals:
  # Cattura delle trame grezze, spenta di default: accesa pubblica due
  # stati per ogni comando.
  - id: g_sniff
    type: bool
    restore_value: true
    initial_value: "false"

# =====================================================================
# SENSORI
# =====================================================================

sensor:
  - platform: pipsolar
    pipsolar_id: inverter0
    # ---- QPIGS: misure ----
    grid_voltage:
      name: "grid voltage"
    grid_frequency:
      name: "grid frequency"
    ac_output_voltage:
      name: "output voltage"
    ac_output_frequency:
      name: "output frequency"
    ac_output_apparent_power:
      name: "output apparent power"
    ac_output_active_power:
      name: "output active power"
      id: pip_out_w
    output_load_percent:
      name: "load percent"
    bus_voltage:
      name: "bus voltage"
    battery_voltage:
      name: "battery voltage"
      id: pip_batt_v
    battery_charging_current:
      name: "battery charging current"
      id: pip_batt_chg
    battery_discharge_current:
      name: "battery discharge current"
      id: pip_batt_dis
    battery_capacity_percent:
      name: "battery SoC"
      id: pip_soc
    inverter_heat_sink_temperature:
      name: "heat sink temperature"
      id: pip_temp
    pv_input_current_for_battery:
      name: "PV current"
    pv_input_voltage:
      name: "PV voltage"
    pv_charging_power:
      name: "PV power"
    # ---- QPIRI: impostazioni lette dall'inverter ----
    battery_recharge_voltage:
      name: "battery recharge voltage"
      id: pip_recharge_v
    battery_under_voltage:
      name: "battery under voltage"
      id: pip_under_v
    battery_bulk_voltage:
      name: "battery bulk voltage"
      id: pip_bulk_v
    battery_float_voltage:
      name: "battery float voltage"
      id: pip_float_v
    battery_redischarge_voltage:
      name: "battery redischarge voltage"
      # Il componente pipsolar non dà unità né classe a questo sensore (a
      # differenza delle altre tensioni QPIRI).
      unit_of_measurement: V
      device_class: voltage
      state_class: measurement
    current_max_ac_charging_current:
      name: "max utility charging current"
    current_max_charging_current:
      name: "max total charging current"
    output_source_priority:
      name: "output source priority"
    charger_source_priority:
      name: "charger source priority"

  # ---- Batteria: corrente, potenza ed energia ----
  # Positiva in carica, negativa in scarica.
  - platform: template
    name: "battery current"
    id: pip_batt_a
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 10s
    lambda: |-
      if (!id(pip_batt_chg).has_state() || !id(pip_batt_dis).has_state())
        return {};
      return id(pip_batt_chg).state - id(pip_batt_dis).state;

  - platform: template
    name: "battery power"
    id: pip_batt_w
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      if (!id(pip_batt_a).has_state() || !id(pip_batt_v).has_state())
        return {};
      return id(pip_batt_a).state * id(pip_batt_v).state;

  # Potenze sempre positive, una per verso: le usano il conteggio del SOC
  # (automazione "PI30 SOC batteria") e i contatori di energia qui sotto.
  - platform: template
    name: "battery charge power"
    id: pip_chg_w
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      if (!id(pip_batt_w).has_state())
        return {};
      return std::max(id(pip_batt_w).state, 0.0f);

  - platform: template
    name: "battery discharge power"
    id: pip_dis_w
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      if (!id(pip_batt_w).has_state())
        return {};
      return std::max(-id(pip_batt_w).state, 0.0f);

  # Energia totale (per la dashboard Energia di Home Assistant): integrata
  # qui e salvata in flash, sopravvive ai riavvii.
  - platform: integration
    name: "battery charge energy"
    sensor: pip_chg_w
    time_unit: h
    integration_method: left
    restore: true
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  - platform: integration
    name: "battery discharge energy"
    sensor: pip_dis_w
    time_unit: h
    integration_method: left
    restore: true
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  # Energia di oggi (si azzera a mezzanotte)
  - platform: total_daily_energy
    name: "battery charge energy today"
    id: pip_chg_kwh_today
    power_id: pip_chg_w
    restore: true
    unit_of_measurement: "kWh"
    accuracy_decimals: 2
    filters:
      - multiply: 0.001

  - platform: total_daily_energy
    name: "battery discharge energy today"
    id: pip_dis_kwh_today
    power_id: pip_dis_w
    restore: true
    unit_of_measurement: "kWh"
    accuracy_decimals: 2
    filters:
      - multiply: 0.001

  # ---- WiFi ----
  - platform: wifi_signal
    name: "WiFi signal"
    id: wifi_signal_db
    update_interval: 10s
    entity_category: diagnostic

  - platform: copy
    source_id: wifi_signal_db
    id: wifi_signal_percentage
    name: "WiFi signal percent"
    unit_of_measurement: "%"
    entity_category: diagnostic
    filters:
      - lambda: return std::min(std::max(2.0f * (x + 100.0f), 0.0f), 100.0f);

text_sensor:
  - platform: pipsolar
    pipsolar_id: inverter0
    device_mode:
      name: "device mode"
      filters:
        map:
          - P -> Power on
          - S -> Standby
          - L -> Line mode
          - B -> Battery mode
          - F -> Fault
          - D -> Shutdown
    # Risposte grezze dei comandi che il componente interroga da solo (CRC
    # già verificato e tolto). QFLAG e QPIWS allungherebbero il giro di un
    # comando ciascuno: aggiungili solo se servono.
    last_qpiri:
      name: "last QPIRI"
      entity_category: diagnostic
    last_qpigs:
      name: "last QPIGS"
      entity_category: diagnostic
    last_qmod:
      name: "last QMOD"
      entity_category: diagnostic

  - platform: template
    name: "last TX"
    id: ts_last_tx
    update_interval: never
    entity_category: diagnostic

  - platform: template
    name: "last RX"
    id: ts_last_rx
    update_interval: never
    entity_category: diagnostic

  - platform: wifi_info
    ip_address:
      name: "IP address"
      id: ip_address
    ssid:
      name: "WiFi SSID"
      id: wifi_ssid
    bssid:
      name: "WiFi BSSID"
    mac_address:
      name: "MAC address"
    dns_address:
      name: "DNS address"

binary_sensor:
  - platform: pipsolar
    pipsolar_id: inverter0
    load_status:
      name: "load on"
    charging_status:
      name: "charging"
    scc_charging_status:
      name: "SCC charging"
    ac_charging_status:
      name: "AC charging"
    charging_to_floating_mode:
      name: "charging to floating mode"
    switch_on:
      name: "switch on"
      entity_category: diagnostic
    configuration_status:
      name: "configuration changed"
      entity_category: diagnostic

# =====================================================================
# COMANDI
# =====================================================================

switch:
  - platform: template
    name: "raw frame capture"
    id: sw_sniff
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    turn_on_action:
      - lambda: id(g_sniff) = true;
    turn_off_action:
      - lambda: id(g_sniff) = false;

  # Priorità di uscita (POP): lo stato reale è "output source priority"
  - platform: pipsolar
    pipsolar_id: inverter0
    output_source_priority_utility:
      name: "output priority utility"
    output_source_priority_solar:
      name: "output priority solar"
    output_source_priority_battery:
      name: "output priority SBU"
    input_voltage_range:
      name: "input voltage range UPS"
    pv_ok_condition_for_parallel:
      name: "PV OK condition for parallel"
    pv_power_balance:
      name: "PV power balance"

output:
  - platform: pipsolar
    pipsolar_id: inverter0
    # Le possible_values di default del componente sono per unità a 48V e
    # write_state() scarta in silenzio tutto il resto: per un banco a 24V
    # vanno dichiarate qui.
    battery_recharge_voltage:
      id: out_recharge_v
      # Verificato: accetta i decimali (PBCV23.6 -> ACK).
      possible_values:
        [22.0, 22.1, 22.2, 22.3, 22.4, 22.5, 22.6, 22.7, 22.8, 22.9, 23.0,
         23.1, 23.2, 23.3, 23.4, 23.5, 23.6, 23.7, 23.8, 23.9, 24.0, 24.1,
         24.2, 24.3, 24.4, 24.5, 24.6, 24.7, 24.8, 24.9, 25.0, 25.1, 25.2,
         25.3, 25.4, 25.5, 25.6, 25.7, 25.8, 25.9, 26.0]
    battery_under_voltage:
      id: out_under_v
      possible_values:
        [20.0, 20.1, 20.2, 20.3, 20.4, 20.5, 20.6, 20.7, 20.8, 20.9, 21.0,
         21.1, 21.2, 21.3, 21.4, 21.5, 21.6, 21.7, 21.8, 21.9, 22.0, 22.1,
         22.2, 22.3, 22.4, 22.5, 22.6, 22.7, 22.8, 22.9, 23.0, 23.1, 23.2,
         23.3, 23.4, 23.5, 23.6, 23.7, 23.8, 23.9, 24.0]
    battery_float_voltage:
      id: out_float_v
      possible_values:
        [24.0, 24.1, 24.2, 24.3, 24.4, 24.5, 24.6, 24.7, 24.8, 24.9, 25.0,
         25.1, 25.2, 25.3, 25.4, 25.5, 25.6, 25.7, 25.8, 25.9, 26.0, 26.1,
         26.2, 26.3, 26.4, 26.5, 26.6, 26.7, 26.8, 26.9, 27.0, 27.1, 27.2,
         27.3, 27.4, 27.5, 27.6, 27.7, 27.8, 27.9, 28.0, 28.1, 28.2, 28.3,
         28.4, 28.5, 28.6, 28.7, 28.8, 28.9, 29.0, 29.1, 29.2]
    battery_redischarge_voltage:
      id: out_redischarge_v
      # Verificato: solo passi da 0.5 (i decimali rispondono NAK), e lo 0.0
      # del manuale non è accettato da questa unità.
      possible_values:
        [24.0, 24.5, 25.0, 25.5, 26.0, 26.5, 27.0, 27.5, 28.0, 28.5, 29.0]
    current_max_ac_charging_current:
      id: out_max_ac_charge_a
      possible_values: [2, 10, 20, 30, 40, 50, 60, 70, 80]
    # current_max_charging_current non è dichiarato: il suo comando
    # "MCHGC0%02.0f" non funziona su questo inverter (vedi "set max total
    # charging current", che accoda MNCHGC).
    charger_source_priority:
      id: out_charger_priority
      possible_values: [0, 1, 2, 3]

# Tensioni: valore libero entro i limiti, un comando per ogni modifica
number:
  - platform: template
    name: "set battery bulk voltage"
    unit_of_measurement: "V"
    device_class: voltage
    min_value: 24.0
    max_value: 29.2
    step: 0.1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 29.0
    entity_category: config
    # Il componente non espone il bulk come output: PCVV viene accodato
    # direttamente (il CRC lo calcola comunque il componente).
    set_action:
      - lambda: |-
          char buf[16];
          snprintf(buf, sizeof(buf), "PCVV%04.1f", roundf(x * 10.0f) / 10.0f);
          ESP_LOGI("PI30", "invio %s", buf);
          id(inverter0).queue_command(buf);

  - platform: template
    name: "set battery float voltage"
    unit_of_measurement: "V"
    device_class: voltage
    min_value: 24.0
    max_value: 29.0
    step: 0.1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 27.0
    entity_category: config
    set_action:
      - output.pipsolar.set_level:
          id: out_float_v
          value: !lambda return roundf(x * 10.0f) / 10.0f;

  - platform: template
    name: "set battery recharge voltage"
    unit_of_measurement: "V"
    device_class: voltage
    min_value: 22.0
    max_value: 26.0
    step: 0.1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 25.5
    entity_category: config
    set_action:
      - output.pipsolar.set_level:
          id: out_recharge_v
          value: !lambda return roundf(x * 10.0f) / 10.0f;

  - platform: template
    name: "set battery redischarge voltage"
    unit_of_measurement: "V"
    device_class: voltage
    min_value: 24.0
    max_value: 29.0
    step: 0.5
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 26.5
    entity_category: config
    set_action:
      - output.pipsolar.set_level:
          id: out_redischarge_v
          value: !lambda return roundf(x * 2.0f) / 2.0f;

  - platform: template
    name: "set battery under voltage"
    unit_of_measurement: "V"
    device_class: voltage
    min_value: 21.0
    max_value: 24.0
    step: 0.1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 24.0
    entity_category: config
    set_action:
      - output.pipsolar.set_level:
          id: out_under_v
          value: !lambda return roundf(x * 10.0f) / 10.0f;

# Correnti: solo i valori accettati dall'inverter, una scelta = un comando
select:
  - platform: template
    name: "set max utility charging current"
    id: sel_max_ac_charge
    optimistic: true
    restore_value: true
    entity_category: config
    initial_option: "2"
    # Massimo reale di questo inverter: 60A (non gli 80 del listino
    # QMUCHGCR generico).
    options: ["2", "10", "20", "30", "40", "50", "60"]
    set_action:
      - output.pipsolar.set_level:
          id: out_max_ac_charge_a
          value: !lambda return atof(x.c_str());

  - platform: template
    name: "set max total charging current"
    id: sel_max_charge
    optimistic: true
    restore_value: true
    entity_category: config
    initial_option: "60"
    # Verificato: questo inverter vuole MNCHGC<mnnn> ("MNCHGC0080" per 80A).
    # Il "MCHGC0%02.0f" del componente oltre i 50A viene rifiutato, quindi
    # il comando è accodato a mano.
    options: ["10", "20", "30", "40", "50", "60", "70", "80"]
    set_action:
      - lambda: |-
          char buf[16];
          snprintf(buf, sizeof(buf), "MNCHGC0%03d", atoi(x.c_str()));
          ESP_LOGI("PI30", "invio %s", buf);
          id(inverter0).queue_command(buf);

# Comando manuale: il CRC lo calcola il componente. Per i comandi in coda
# il componente controlla solo l'"(ACK": l'esito delle scritture si vede nel
# log ("command successful"), la risposta delle letture con "raw frame
# capture" acceso ("last RX").
text:
  - platform: template
    name: "manual command"
    id: txt_cmd
    optimistic: true
    mode: text
    initial_value: "QPI"
    restore_value: true
    entity_category: config

button:
  - platform: template
    name: "send manual command"
    entity_category: config
    on_press:
      - lambda: |-
          const std::string &c = id(txt_cmd).state;
          if (c.empty()) {
            ESP_LOGW("PI30", "comando vuoto, non inviato");
            return;
          }
          ESP_LOGI("PI30", "invio comando manuale: %s", c.c_str());
          id(inverter0).queue_command(c);

  # Priorità di carica (PCP). Pulsanti e non switch: lo stato reale è uno
  # solo, "charger source priority". PCP00 (solo rete) risponde NAK su
  # questo inverter.
  - platform: template
    name: "charger solar first"
    on_press:
      - output.pipsolar.set_level:
          id: out_charger_priority
          value: 1.0

  - platform: template
    name: "charger solar + utility"
    on_press:
      - output.pipsolar.set_level:
          id: out_charger_priority
          value: 2.0

  - platform: template
    name: "charger solar only"
    on_press:
      - output.pipsolar.set_level:
          id: out_charger_priority
          value: 3.0

  # Rilegge subito QPIRI, QPIGS e QMOD (rimette in coda i poll)
  - platform: template
    name: "refresh now"
    entity_category: config
    on_press:
      - lambda: id(inverter0).update();

  # Letture che il componente non interroga: la risposta si vede in
  # "last RX" con "raw frame capture" acceso.
  - platform: template
    name: "QPI protocol"
    entity_category: config
    on_press:
      - lambda: id(inverter0).queue_command("QPI");

  - platform: template
    name: "QID serial number"
    entity_category: config
    on_press:
      - lambda: id(inverter0).queue_command("QID");

  - platform: template
    name: "QVFW firmware"
    entity_category: config
    on_press:
      - lambda: id(inverter0).queue_command("QVFW");

  - platform: template
    name: "QDI defaults"
    entity_category: config
    on_press:
      - lambda: id(inverter0).queue_command("QDI");

  - platform: template
    name: "QMCHGCR charging currents"
    entity_category: config
    on_press:
      - lambda: id(inverter0).queue_command("QMCHGCR");

  - platform: template
    name: "QMUCHGCR utility charging currents"
    entity_category: config
    on_press:
      - lambda: id(inverter0).queue_command("QMUCHGCR");

# =====================================================================
# DISPLAY (SSD1306 128x64): sette pagine a rotazione ogni 4s
# =====================================================================

interval:
  - interval: 4s
    then:
      - display.page.show_next: my_display
      - component.update: my_display

i2c:
  - id: bus_a
    sda: GPIO17
    scl: GPIO18
    scan: false

image:
  - platform: file
    file: solar_power.bmp
    id: solar_icon
    resize: 65x50
    type: BINARY

graph:
  - id: battery_voltage_graph
    duration: 1h
    x_grid: 10min
    y_grid: 1
    width: 128
    height: 64
    min_value: 23
    max_value: 29
    border: true
    traces:
      - sensor: pip_batt_v
        line_thickness: 3
        line_type: SOLID
        continuous: true

  - id: battery_voltage_graph2
    duration: 24h
    x_grid: 4h
    y_grid: 1
    width: 128
    height: 64
    min_value: 23
    max_value: 29
    border: true
    traces:
      - sensor: pip_batt_v
        line_thickness: 3
        line_type: SOLID
        continuous: true

display:
  - platform: ssd1306_i2c
    model: SSD1306_128X64
    reset_pin: GPIO21
    i2c_id: bus_a
    address: 0x3c
    contrast: 70%
    id: my_display
    show_test_card: false
    pages:
      - id: page1
        lambda: |-
          auto now = id(sntp_zone_time).now();
          if (!now.is_valid()) {
            it.printf(it.get_width() / 2, it.get_height() / 2, id(arial),
                      TextAlign::CENTER, "Ora non disponibile");
            return;
          }
          const char *giorno = "---";
          switch (now.day_of_week) {
            case 1: giorno = "Domenica"; break;
            case 2: giorno = "Lunedì"; break;
            case 3: giorno = "Martedì"; break;
            case 4: giorno = "Mercoledì"; break;
            case 5: giorno = "Giovedì"; break;
            case 6: giorno = "Venerdì"; break;
            case 7: giorno = "Sabato"; break;
          }
          const char *mese = "---";
          switch (now.month) {
            case 1: mese = "Gen"; break;
            case 2: mese = "Feb"; break;
            case 3: mese = "Mar"; break;
            case 4: mese = "Apr"; break;
            case 5: mese = "Mag"; break;
            case 6: mese = "Giu"; break;
            case 7: mese = "Lug"; break;
            case 8: mese = "Ago"; break;
            case 9: mese = "Set"; break;
            case 10: mese = "Ott"; break;
            case 11: mese = "Nov"; break;
            case 12: mese = "Dic"; break;
          }
          it.printf(0, 0, id(arial), TextAlign::TOP_LEFT, "Travis90x");
          it.image(10, 16, id(solar_icon));
          it.printf(it.get_width(), it.get_height() - 48, id(arial),
                    TextAlign::BASELINE_RIGHT, "%s", giorno);
          it.strftime(it.get_width(), it.get_height() - 36, id(arial),
                      TextAlign::BASELINE_RIGHT, "%d", now);
          it.printf(it.get_width(), it.get_height() - 26, id(arial),
                    TextAlign::BASELINE_RIGHT, "%s", mese);
          it.strftime(it.get_width(), it.get_height() - 12, id(arial),
                      TextAlign::BASELINE_RIGHT, "%Y", now);
          it.strftime(it.get_width(), it.get_height(), id(arial),
                      TextAlign::BASELINE_RIGHT, "%H:%M", now);

      - id: page2
        lambda: |-
          it.printf(0, 0, id(icon_font), TextAlign::TOP_LEFT, "󰖩");
          it.printf(20, 0, id(arial), TextAlign::TOP_LEFT, "SSID:");
          it.printf(it.get_width(), 0, id(arial), TextAlign::TOP_RIGHT,
                    "%s", id(wifi_ssid).state.c_str());
          it.printf(0, it.get_height() - 37, id(arial),
                    TextAlign::BASELINE_LEFT, "IP");
          it.printf(it.get_width(), it.get_height() - 37, id(arial),
                    TextAlign::BASELINE_RIGHT, "%s", id(ip_address).state.c_str());
          it.printf(0, it.get_height() - 25, id(arial),
                    TextAlign::BASELINE_LEFT, "WiFi Signal");
          it.printf(it.get_width(), it.get_height() - 25, id(arial),
                    TextAlign::BASELINE_RIGHT, "%.0f%%",
                    id(wifi_signal_percentage).state);
          it.printf(0, it.get_height() - 13, id(arial),
                    TextAlign::BASELINE_LEFT, "WiFi");
          it.printf(it.get_width(), it.get_height() - 13, id(arial),
                    TextAlign::BASELINE_RIGHT, "%.0f dBm", id(wifi_signal_db).state);

      - id: page3
        lambda: |-
          it.printf(0, 0, id(icon_font), TextAlign::TOP_LEFT, "󱊣");
          it.printf(it.get_width() / 2, 0, id(arial), TextAlign::TOP_CENTER,
                    "BATTERIA");
          it.printf(0, it.get_height() - 37, id(arial),
                    TextAlign::BASELINE_LEFT, "Tensione");
          it.printf(it.get_width(), it.get_height() - 37, id(arial),
                    TextAlign::BASELINE_RIGHT, "%.2f V", id(pip_batt_v).state);
          it.printf(0, it.get_height() - 25, id(arial),
                    TextAlign::BASELINE_LEFT, "SOC");
          it.printf(it.get_width(), it.get_height() - 25, id(arial),
                    TextAlign::BASELINE_RIGHT, "%.0f%%", id(pip_soc).state);
          it.printf(0, it.get_height() - 13, id(arial),
                    TextAlign::BASELINE_LEFT, "Temp.");
          it.printf(it.get_width(), it.get_height() - 13, id(arial),
                    TextAlign::BASELINE_RIGHT, "%.0f°C", id(pip_temp).state);
          it.printf(0, it.get_height() - 1, id(arial),
                    TextAlign::BASELINE_LEFT, "Power");
          it.printf(it.get_width(), it.get_height() - 1, id(arial),
                    TextAlign::BASELINE_RIGHT, "%.0f W", id(pip_out_w).state);

      # Energia di oggi, calcolata sul dispositivo
      - id: page4
        lambda: |-
          it.printf(0, 0, id(icon_font), TextAlign::TOP_LEFT, "󱊥");
          it.printf(it.get_width() / 2, 0, id(arial), TextAlign::TOP_CENTER,
                    "BATTERIA");
          it.printf(0, it.get_height() - 37, id(arial),
                    TextAlign::BASELINE_LEFT, "Carica");
          it.printf(it.get_width(), it.get_height() - 37, id(arial),
                    TextAlign::BASELINE_RIGHT, "%.0f W", id(pip_chg_w).state);
          it.printf(0, it.get_height() - 25, id(arial),
                    TextAlign::BASELINE_LEFT, "Caricata");
          it.printf(it.get_width(), it.get_height() - 25, id(arial),
                    TextAlign::BASELINE_RIGHT, "%.2f kWh", id(pip_chg_kwh_today).state);
          it.printf(0, it.get_height() - 13, id(arial),
                    TextAlign::BASELINE_LEFT, "Scarica");
          it.printf(it.get_width(), it.get_height() - 13, id(arial),
                    TextAlign::BASELINE_RIGHT, "%.0f W", id(pip_dis_w).state);
          it.printf(0, it.get_height() - 1, id(arial),
                    TextAlign::BASELINE_LEFT, "Scaricata");
          it.printf(it.get_width(), it.get_height() - 1, id(arial),
                    TextAlign::BASELINE_RIGHT, "%.2f kWh", id(pip_dis_kwh_today).state);

      - id: page5
        lambda: |-
          it.printf(0, 0, id(icon_font), TextAlign::TOP_LEFT, "󱊦");
          it.printf(it.get_width() / 2, 0, id(arial), TextAlign::TOP_CENTER,
                    "SETTAGGI");
          it.printf(0, it.get_height() - 37, id(arial),
                    TextAlign::BASELINE_LEFT, "Bulk");
          it.printf(it.get_width(), it.get_height() - 37, id(arial),
                    TextAlign::BASELINE_RIGHT, "%.1f V", id(pip_bulk_v).state);
          it.printf(0, it.get_height() - 25, id(arial),
                    TextAlign::BASELINE_LEFT, "Float");
          it.printf(it.get_width(), it.get_height() - 25, id(arial),
                    TextAlign::BASELINE_RIGHT, "%.1f V", id(pip_float_v).state);
          it.printf(0, it.get_height() - 13, id(arial),
                    TextAlign::BASELINE_LEFT, "Ricarica");
          it.printf(it.get_width(), it.get_height() - 13, id(arial),
                    TextAlign::BASELINE_RIGHT, "%.1f V", id(pip_recharge_v).state);
          it.printf(0, it.get_height() - 1, id(arial),
                    TextAlign::BASELINE_LEFT, "Stop");
          it.printf(it.get_width(), it.get_height() - 1, id(arial),
                    TextAlign::BASELINE_RIGHT, "%.1f V", id(pip_under_v).state);

      - id: page6
        lambda: it.graph(0, 0, id(battery_voltage_graph));

      - id: page7
        lambda: it.graph(0, 0, id(battery_voltage_graph2));

