# Force minimum total charging current to 60A

id: battery_charging_force_minimum_total
alias: "Battery Charging - Force Minimum Total Current"
description: "Ensures max_total_charging_current is at least 60A for system stability"

trigger:
  - platform: state
    entity_id: select.heltec_pi30_display_pi30_set_max_total_charging_current
  - platform: time_pattern
    minutes: "/30"

condition:
  - condition: template
    value_template: "{{ states('select.heltec_pi30_display_pi30_set_max_total_charging_current') not in ['unknown', 'unavailable'] }}"
  - condition: template
    value_template: "{{ states('select.heltec_pi30_display_pi30_set_max_total_charging_current') | int(default=0) < 60 }}"

action:
  - service: select.select_option
    target:
      entity_id: select.heltec_pi30_display_pi30_set_max_total_charging_current
    data:
      option: "60"

mode: single
max_exceeded: silent
