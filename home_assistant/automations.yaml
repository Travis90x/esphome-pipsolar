# Battery Charging Automation with Hysteresis Control
# Modulates charging current based on grid power consumption and battery state
# Hysteresis: 500W entry threshold, 300W modulization threshold

- id: battery_charging_intelligent_modulation
  alias: "Battery Charging - Intelligent Modulation"
  description: "Smart battery charging with current modulation based on grid power and battery state"

  trigger:
    # Trigger on startup
    - platform: homeassistant
      event: start
    # Trigger every 10 minutes
    - platform: time_pattern
      minutes: "/10"
    # Trigger on state changes of key sensors
    - platform: state
      entity_id: sensor.heltec_pi30_battery_soc
    - platform: state
      entity_id: sensor.heltec_pi30_battery_voltage
    - platform: state
      entity_id: sensor.heltec_pi30_pi30_grid_frequency
    - platform: state
      entity_id: sensor.heltec_pi30_battery_power

  variables:
    # Charging current step progression
    charging_steps: [2, 10, 20, 30, 40, 50, 60]

    # Read sensor values with fallback to unknown
    soc: "{{ states('sensor.heltec_pi30_battery_soc') | float(default=none) }}"
    voltage: "{{ states('sensor.heltec_pi30_battery_voltage') | float(default=none) }}"
    grid_power: "{{ states('sensor.heltec_pi30_pi30_grid_frequency') | float(default=none) }}"
    battery_power: "{{ states('sensor.heltec_pi30_battery_power') | float(default=none) }}"

    # Current charging current setting
    current_charging_current: "{{ states('select.heltec_pi30_display_pi30_set_max_utility_charging_current') | int(default=0) }}"

    # Determine if any sensor is unknown
    sensors_unknown: "{{ soc is none or voltage is none }}"
    power_sensors_known: "{{ grid_power is not none and battery_power is not none }}"

  action:
    # Check for three favorable conditions to enter CARICA mode
    - choose:
        # Condition 1: SOC >= 100
        - conditions:
            - condition: template
              value_template: "{{ soc is not none and soc >= 100 }}"
          sequence:
            - service: script.pi30_batteria_da_caricare

        # Condition 2: VOLT >= 54
        - conditions:
            - condition: template
              value_template: "{{ voltage is not none and voltage >= 54 }}"
          sequence:
            - service: script.pi30_batteria_da_caricare

        # Condition 3: SOC >= 80 AND VOLT >= 52
        - conditions:
            - condition: template
              value_template: "{{ soc is not none and soc >= 80 and voltage is not none and voltage >= 52 }}"
          sequence:
            - service: script.pi30_batteria_da_caricare

        # Paracadute: If sensors unknown but power is known and favorable
        - conditions:
            - condition: template
              value_template: "{{ sensors_unknown and power_sensors_known and grid_power < 500 and battery_power < 200 }}"
          sequence:
            - service: script.pi30_batteria_da_caricare
            # Set to minimum 2A
            - service: select.select_option
              target:
                entity_id: select.heltec_pi30_display_pi30_set_max_utility_charging_current
              data:
                option: "2"

      # Default: Continue modulation logic if in CARICA state
      default:
        # Hysteresis modulization: adjust current based on grid power threshold
        - choose:
            # AUMENTA condition: grid_power < 300 AND battery_power < 200
            - conditions:
                - condition: template
                  value_template: "{{ grid_power is not none and battery_power is not none and grid_power < 300 and battery_power < 200 }}"
              sequence:
                - service: script.pi30_batteria_aumenta_corrente_carica

            # DIMINUISCI condition: grid_power >= 300 OR battery_power >= 200
            - conditions:
                - condition: template
                  value_template: "{{ grid_power is not none and battery_power is not none and (grid_power >= 300 or battery_power >= 200) }}"
              sequence:
                - service: script.pi30_batteria_diminuisci_corrente_carica

            # Emergency SCARICA: utility at minimum (2A) but conditions unfavorable
            - conditions:
                - condition: template
                  value_template: "{{ current_charging_current == 2 and grid_power is not none and battery_power is not none and (grid_power > 500 or battery_power > 200) }}"
              sequence:
                - service: script.pi30_batteria_da_scaricare

  mode: single
  max_exceeded: silent

# Safety automation: Ensure total charging current >= utility charging current
- id: battery_charging_safety_total_current
  alias: "Battery Charging - Safety Total Current"
  description: "Ensures max_total_charging_current >= max_utility_charging_current"

  trigger:
    - platform: state
      entity_id: select.heltec_pi30_display_pi30_set_max_utility_charging_current
    - platform: state
      entity_id: select.heltec_pi30_display_pi30_set_max_total_charging_current

  condition:
    - condition: template
      value_template: "{{ states('select.heltec_pi30_display_pi30_set_max_utility_charging_current') not in ['unknown', 'unavailable'] }}"

  action:
    - variables:
        utility_current: "{{ states('select.heltec_pi30_display_pi30_set_max_utility_charging_current') | int(default=0) }}"
        total_current: "{{ states('select.heltec_pi30_display_pi30_set_max_total_charging_current') | int(default=0) }}"

    - condition: template
      value_template: "{{ total_current < utility_current }}"

    - service: select.select_option
      target:
        entity_id: select.heltec_pi30_display_pi30_set_max_total_charging_current
      data:
        option: "{{ states('select.heltec_pi30_display_pi30_set_max_utility_charging_current') }}"

  mode: single
  max_exceeded: silent

# Force minimum total charging current to 60A
- id: battery_charging_force_minimum_total
  alias: "Battery Charging - Force Minimum Total Current"
  description: "Ensures max_total_charging_current is at least 60A for system stability"

  trigger:
    - platform: state
      entity_id: select.heltec_pi30_display_pi30_set_max_total_charging_current
    - platform: time_pattern
      minutes: "/30"

  condition:
    - condition: template
      value_template: "{{ states('select.heltec_pi30_display_pi30_set_max_total_charging_current') not in ['unknown', 'unavailable'] }}"
    - condition: template
      value_template: "{{ states('select.heltec_pi30_display_pi30_set_max_total_charging_current') | int(default=0) < 60 }}"

  action:
    - service: select.select_option
      target:
        entity_id: select.heltec_pi30_display_pi30_set_max_total_charging_current
      data:
        option: "60"

  mode: single
  max_exceeded: silent
