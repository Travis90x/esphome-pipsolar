alias: PI30 Battery SOC Coulomb Counting
description: >-
  Stima il SOC reale del pacco LiFePO4 8S (155Ah) integrando nel tempo la
  corrente di sensor.heltec_pi30_battery_current (positiva in carica,
  negativa in scarica), invece di leggere il SOC dalla sola tensione:
  la curva Volt/SOC del LiFePO4 e' troppo piatta a meta' carica e si
  sposta in base a quanto la batteria sta assorbendo/erogando in quel
  momento, quindi la tensione da sola non basta.
  Il valore accumulato viene poi ricalibrato ai due estremi per
  eliminare la deriva del coulomb counting, confrontando le soglie NON
  con la tensione grezza ma con una tensione "compensata" per la
  caduta resistiva interna (voltage_ocv = voltage - current *
  internal_resistance_ohm, stessa convenzione di segno del sensore
  corrente: positiva in carica alza la tensione misurata sopra la vera
  OCV, negativa in scarica la abbassa), altrimenti una batteria che sta
  ancora caricando forte a tensione alta scatterebbe a 100% troppo
  presto (e viceversa in scarica):
    - 100% quando voltage_ocv raggiunge la tensione di float
      (sensor.heltec_pi30_display_pi30_battery_float_voltage): a quel
      punto la batteria e' per definizione piena.
    - 0% quando voltage_ocv scende sotto la tensione di under-voltage
      (sensor.heltec_pi30_display_pi30_battery_under_voltage) + 0.2V di
      margine, per avere un po' di scarto prima che sia il BMS stesso a
      staccare la batteria.
  internal_resistance_ohm e' un valore SEGNAPOSTO (6 mOhm, stima
  grezza per un pacco 8S di grandi celle prismatiche): va tarato con
  un paio di letture reali (vedi README.md, sezione taratura
  resistenza interna).
  Per cambiare la capacita' del pacco modifica capacity_ah qui sotto
  (action > variables). Se cambi la cadenza del trigger "cadenza",
  aggiorna anche dt_hours di conseguenza (dt_hours = minuti / 60).
triggers:
  - trigger: time_pattern
    id: cadenza
    minutes: /2
  - trigger: homeassistant
    id: avvio
    event: start
conditions: []
actions:
  - variables:
      capacity_ah: 155
      internal_resistance_ohm: 0.006
      dt_hours: '{{ 2 / 60 }}'
      voltage: >-
        {{ states('sensor.heltec_pi30_battery_voltage') | float(default=none)
        }}
      current: >-
        {{ states('sensor.heltec_pi30_battery_current') | float(default=none)
        }}
      float_voltage: >-
        {{
        states('sensor.heltec_pi30_display_pi30_battery_float_voltage') |
        float(default=none) }}
      under_voltage: >-
        {{
        states('sensor.heltec_pi30_display_pi30_battery_under_voltage') |
        float(default=none) }}
      soc_now: >-
        {{ states('input_number.pi30_battery_soc_calcolato') |
        float(default=50) }}
      full_threshold: '{{ (float_voltage - 0.1) if float_voltage is not none else none }}'
      empty_threshold: '{{ (under_voltage + 0.2) if under_voltage is not none else none }}'
  - if:
      - condition: template
        value_template: '{{ voltage is none or current is none }}'
    then:
      - stop: Tensione o corrente non disponibili, nessun aggiornamento
  - variables:
      voltage_ocv: '{{ voltage - (current * internal_resistance_ohm) }}'
  - choose:
      - conditions:
          - condition: template
            value_template: '{{ full_threshold is not none and voltage_ocv >= full_threshold }}'
        sequence:
          - target:
              entity_id: input_number.pi30_battery_soc_calcolato
            data:
              value: 100
            action: input_number.set_value
      - conditions:
          - condition: template
            value_template: '{{ empty_threshold is not none and voltage_ocv <= empty_threshold }}'
        sequence:
          - target:
              entity_id: input_number.pi30_battery_soc_calcolato
            data:
              value: 0
            action: input_number.set_value
      - conditions:
          - condition: trigger
            id: cadenza
        sequence:
          - target:
              entity_id: input_number.pi30_battery_soc_calcolato
            data:
              value: >-
                {{ min(max(soc_now + (current * dt_hours / capacity_ah *
                100), 0), 100) | round(1) }}
            action: input_number.set_value
    default: []
mode: single
max_exceeded: silent
