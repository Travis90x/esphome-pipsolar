alias: PI30 Battery SOC Coulomb Counting
description: >-
  Estimates the real SOC of the 8S LiFePO4 pack (155Ah) by integrating
  over time the current from sensor.heltec_pi30_battery_current
  (positive while charging, negative while discharging), instead of
  reading SOC from voltage alone: the LiFePO4 Volt/SOC curve is too
  flat in the mid-range and shifts depending on how much the battery
  is drawing/delivering at that moment, so voltage alone is not
  enough.
  INTEGRATION. Every 2 minutes (and at Home Assistant startup) the
  counter moves by current * elapsed_hours / capacity_ah * 100, where
  elapsed_hours is the REAL time since the previous run (from
  this.attributes.last_triggered), not a fixed 2 minutes: a run that
  arrives late, an anchor run in between or a restart no longer count
  a wrong amount of time. It is capped at max_dt_hours (6 minutes) so
  that a long outage does not integrate the current read at boot over
  hours of unknown history. The value is stored with 3 decimals: at
  the 1-2A that this pack idles at overnight one step is 0.02-0.04%,
  which the previous 1-decimal rounding threw away entirely (a whole
  night of self-consumption was never counted).
  Plain integration can never CLAIM a full or empty pack: rising it
  stops at 99, falling it stops at 1. It may however keep going down
  from an anchored 100 (or up from an anchored 0), so once the pack is
  anchored full the first Ah drawn out of it are counted from 100, not
  from 99.
  ANCHORS. Only the two template triggers below may write exactly 100
  and exactly 0, to remove coulomb-counting drift, and each one fires
  only once its condition has held for a while ("for"), so a single
  odd reading (a load spike, surface charge right after the charger
  cut off at 80%) cannot re-anchor the counter. The thresholds are
  compared NOT against raw voltage but against a voltage "compensated"
  for the internal resistance drop (voltage_ocv = voltage - current *
  internal_resistance_ohm, same sign convention as the current sensor:
  positive while charging raises the measured voltage above the true
  OCV, negative while discharging lowers it), otherwise a battery still
  charging hard at high voltage would look full too early (and the
  opposite on discharge):
    - full_hold -> 100%: voltage_ocv >= float voltage
      (sensor.heltec_pi30_display_pi30_battery_float_voltage) minus
      full_margin_v (0.1V), AND the pack is not being pushed (current
      <= tail_current_a, 0 by default: idle or discharging), both
      true continuously for 5 minutes. The second half is the
      meaningful test: if the pack holds the float voltage while
      nothing is charging it, that voltage comes from its own state of
      charge, so it really is full. A pack still swallowing current may
      just be held up there by the charger, whatever the voltage says
      - including the low-current case, since charging at 2A because
      there is no surplus is not the same thing as a charge that
      tapered off because the battery would take no more.
      The inverter's own "charging to floating mode" flag is
      deliberately NOT used: it describes the charger's stage, not the
      battery, and the PI30 keeps it raised all night while the pack
      discharges; it used to pin this sensor at 100%.
    - empty_hold -> 0%: voltage_ocv <= under-voltage threshold
      (sensor.heltec_pi30_display_pi30_battery_under_voltage) plus
      empty_margin_v (0.2V, headroom before the BMS itself disconnects
      the battery), continuously for 1 minute.
  A template trigger fires on the false -> true transition of its
  condition, so each anchor writes once per episode; the counter then
  holds the value on its own (0A at float keeps 100, the caps above
  absorb the inverter's +-1A trickle) and re-anchors the next time the
  condition is re-established. If the pack is already full (or empty)
  when this automation is loaded, the anchor waits for the next
  episode: set the helper by hand once, as the README says.
  CONSTANTS live in trigger_variables (used by the two anchor
  triggers; Home Assistant does not expose them to the actions) and in
  actions > variables (capacity, cap): tail_current_a = 0 (A): the pack
  must not be absorbing anything for the 100% anchor to fire. Watch the
  sensor over a full charge cycle: if it never reaches 100% because the
  inverter parks at a small positive current once in float (its own
  trickle, and the PI30 reports whole Amps), raise this to that value
  (1 or 2). Do not raise it above the minimum charging step the
  charging automation uses, or a deliberate low-current charge would be
  mistaken for a tapered one and the anchor would fire early.
  internal_resistance_ohm = 0.0095 (9.5 mOhm), calibrated on the real
  pack: derived from 19 (voltage, current) pairs found in the JK BMS
  exported log ("Cell over charge protection" -> "released" events 2-3
  seconds apart, same SOC), R = weighted average of dV/dI. See the
  repository's main README.md ("Home Assistant automations" section,
  "Real SOC via coulomb counting") for the method and how to recompute
  it if the pack changes. The hold times are the "for" of each anchor
  trigger. To change the pack capacity edit capacity_ah below (actions
  > variables). The cadence trigger can be changed freely: the elapsed
  time is measured, nothing else depends on it.
trigger_variables:
  tail_current_a: 0
  internal_resistance_ohm: 0.0095
  full_margin_v: 0.1
  empty_margin_v: 0.2
triggers:
  - trigger: time_pattern
    id: cadence
    minutes: /2
  - trigger: homeassistant
    id: startup
    event: start
  - trigger: template
    id: full_hold
    value_template: >-
      {% set voltage = states('sensor.heltec_pi30_battery_voltage') | float(default=none) %}
      {% set current = states('sensor.heltec_pi30_battery_current') | float(default=none) %}
      {% set float_voltage = states('sensor.heltec_pi30_display_pi30_battery_float_voltage') | float(default=none) %}
      {{ voltage is not none and current is not none and float_voltage is not none
         and current <= tail_current_a
         and (voltage - current * internal_resistance_ohm) >= (float_voltage - full_margin_v) }}
    for: "00:05:00"
  - trigger: template
    id: empty_hold
    value_template: >-
      {% set voltage = states('sensor.heltec_pi30_battery_voltage') | float(default=none) %}
      {% set current = states('sensor.heltec_pi30_battery_current') | float(default=none) %}
      {% set under_voltage = states('sensor.heltec_pi30_display_pi30_battery_under_voltage') | float(default=none) %}
      {{ voltage is not none and current is not none and under_voltage is not none
         and (voltage - current * internal_resistance_ohm) <= (under_voltage + empty_margin_v) }}
    for: "00:01:00"
conditions: []
actions:
  - variables:
      capacity_ah: 155
      max_dt_hours: "{{ 6 / 60 }}"
      current: >-
        {{ states('sensor.heltec_pi30_battery_current') | float(default=none)
        }}
      soc_now: >-
        {{ states('input_number.pi30_battery_soc_calculated') |
        float(default=50) }}
      dt_hours: >-
        {% set last = this.attributes.last_triggered if this is not none else none %}
        {% set ts = as_timestamp(last, default=none) if last is not none else none %}
        {{ 0 if ts is none else ([(now().timestamp() - ts) / 3600, max_dt_hours] | min) }}
  - choose:
      - conditions:
          - condition: trigger
            id: full_hold
        sequence:
          - target:
              entity_id: input_number.pi30_battery_soc_calculated
            data:
              value: 100
            action: input_number.set_value
      - conditions:
          - condition: trigger
            id: empty_hold
        sequence:
          - target:
              entity_id: input_number.pi30_battery_soc_calculated
            data:
              value: 0
            action: input_number.set_value
    default:
      - if:
          - condition: template
            value_template: "{{ current is none }}"
        then:
          - stop: Battery current unavailable, no update
      - target:
          entity_id: input_number.pi30_battery_soc_calculated
        data:
          value: >-
            {% set delta = current * dt_hours / capacity_ah * 100 %}
            {% set floor = [1, soc_now] | min %}
            {% set ceiling = [99, soc_now] | max %}
            {{ ([floor, soc_now + delta, ceiling] | sort)[1] | round(3) }}
        action: input_number.set_value
mode: single
max_exceeded: silent
