alias: PI30 Battery SOC Energy Counting
description: >-
  Estimates the real SOC of the 8S LiFePO4 pack by counting the energy
  that goes in and out of it, instead of reading SOC from voltage alone:
  the LiFePO4 Volt/SOC curve is too flat in the mid-range and shifts
  depending on how much the battery is drawing/delivering at that
  moment, so voltage alone is not enough (26.6V at 5A for four hours
  says nothing about the SOC; 0.5 kWh moved in four hours does).
  IT WRITES INTO input_number.pi30_battery_soc_calculated, a Number
  helper you create once ("Helper 1 - PI30 Battery SOC calculated
  (Number).yaml" next to this file: UI recipe and YAML equivalent);
  "Helper 2 - ... (Template sensor).yaml" is the rounded display sensor
  sensor.heltec_pi30_display_pi30_battery_soc_calculated. If the
  automation editor shows "entity not found" next to the helper id,
  the helper does not exist or has another id: nothing can work until
  it does, and whatever SOC you are looking at is another sensor (the
  inverter's own sensor.heltec_pi30_battery_soc, voltage-based and
  happily stuck at 100%). The starting value does not matter much: a
  wrong one is pulled back by the voltage correction within about
  15-20 minutes of discharge wherever the voltage is informative, and
  the 100% anchor resets it at the end of every full charge.
  COUNTING. Once a minute (and at Home Assistant startup, and whenever
  you run the automation by hand) it reads the battery charge and
  discharge power (sensor.heltec_pi30_batteria_potenza_carica and
  sensor.heltec_pi30_batteria_potenza_scarica, the same two sensors
  your lifetime energy counters are built on) and multiplies them by
  the REAL time elapsed since the previous run (from
  this.attributes.last_triggered, so a late run, an anchor run in
  between, a restart or a manual run never count a wrong amount of
  time), capped at max_dt_hours (5 minutes) so that a long outage does
  not integrate the power read at boot over hours of unknown history:
    SOC += charge_kw * charge_efficiency * hours / capacity_kwh * 100
    SOC -= discharge_kw * hours / capacity_kwh * 100
  Why not the two lifetime kWh counters directly? They tick every 10
  seconds, and counting their ticks means running this automation
  every 10 seconds (logbook and history full of it). Using them once a
  minute instead would need a second helper to remember the counter
  value of the previous run, and this setup is meant to stay at one
  helper. Integrating the same power once a minute gives the same
  kWh, only sampled every 60 s instead of every 10 s, which for a
  battery is no loss at all.
  CALIBRATION, from three days of history (21-23 Sep 2026) that
  include one complete cycle: full (float, 22 Sep 15:59) -> empty (the
  BMS cut the pack at 22.7V, 23 Sep 10:00) -> full again (23 Sep
  15:10), plus one full -> morning -> full cycle. Three energy balances,
  three unknowns, one exact solution:
    capacity_kwh = 3.9 : energy the pack delivers from 100% to 0%
      (the nominal 155Ah x 25.6V is 3.97 kWh);
    charge_efficiency = 0.87 : share of each charged kWh the PI30
      reports that is stored in the pack;
    idle_drain_w = 50 : power the pack loses that the PI30 NEVER
      reports - the inverter's own consumption, taken from the
      battery whenever the charger is not running. It shows as 0A
      while the voltage keeps falling: on 23 Sep, 04:36-10:00, in Line
      mode, the PI30 read 0A for five and a half hours while the pack
      went from 25.1V to 22.7V.
  With these values the count closes both cycles within 0.2 points (it
  reads 0.2% at the moment the BMS cut the pack, and 100.0% at the end
  of the next charge). Ignoring the idle drain is what made the charge
  side look "twice" the discharge side in an earlier calibration: the
  missing 50W x 11-18 hours is 0.6-0.9 kWh per night.
  So the counting is:
    SOC += charge_kw * charge_efficiency * hours / capacity_kwh * 100
    SOC -= (discharge_kw + idle_drain_w / 1000) * hours / capacity_kwh * 100
  where the idle drain is applied whenever the pack is not really
  charging (see PHANTOM CHARGE below). Recheck all
  three if the pack or the inverter changes: the anchors write both
  lifetime energy counters in the Logbook, so a full -> empty -> full
  cycle gives the numbers again. The power sensors' unit is read from the
  sensor (W or kW). The value is stored with 3 decimals: at the 1-2A
  this pack idles at overnight one step is a few hundredths of a
  percent, which a 1-decimal rounding would throw away entirely.
  PHANTOM CHARGE. A charge power of small_charge_w (60 W, about 2A) or
  less is NOT counted as charge: it is the PI30's own consumption, or
  an offset of its current reading, never energy going into the pack.
  Measured on 24-26 Sep 2026 (Italian time): at night in Battery mode, charger off,
  13 W of load, the PI30 read +1A for 8 hours (the old count went UP
  from 61% to 65%, the voltage said 50%); on 25 Sep 18:30-22:00, Line
  mode, charger on "solar only" in the dark, it read +1A while the
  pack went from 24.5V to 22.7V and the BMS cut it (the old count went
  from 5% to 6%); on 26 Sep 04:02-04:29, grid charging at 2A, it read
  +2A while the pack went from 23.6V to 22.8V and the BMS cut it
  again. So below that threshold the charge is ignored and the idle
  drain is applied, as with 0A. The one exception is the float stage
  (voltage >= full_floor_v, nothing discharging): there the charger
  holds the full pack and feeds the inverter's consumption itself
  (the +2A read for hours at 27.5V), so nothing is counted either way
  and an anchored 100 stays 100.
  Plain counting can never CLAIM a full or empty pack: rising it stops
  at 99, falling it stops at 1. It may however keep going down from an
  anchored 100 (or up from an anchored 0), so once the pack is anchored
  full the first kWh drawn out of it are counted from 100, not from 99.
  The reverse is NOT allowed: any counted charge (above
  small_charge_w) moves an anchored 100 down to 99, because a pack
  that is still taking energy is no longer certified full: a stale 100
  (from an earlier wrong anchor, or set by hand) must not sit there
  while the pack swallows 5A for hours. The 2A float trickle is not a
  counted charge (PHANTOM CHARGE above), so it no longer flickers the
  anchored 100 to 99.
  VOLTAGE CORRECTION. The count alone cannot know where it started:
  if it was set wrong (a stale 100, a helper created mid-discharge) it
  would stay wrong until the next full charge. So every minute the
  measured voltage, compensated for the real current (the reported
  one plus the idle drain), is turned into a SOC
  through a table measured on this pack (ocv_v / ocv_soc below), and
  the count is pulled towards it - but only when the voltage can be
  trusted and only when it clearly disagrees:
    - trusted: discharging or idle (current >= -30A, a phantom +1/+2A
      read as 0A), not at float, and the charger has been off for at
      least 60 minutes: charge power at most small_charge_w, and either
      charge power 0 unchanged for 60 min or both charger flags
      (binary_sensor ..._ac_charging and ..._scc_charging) off for 60
      min. Otherwise surface charge after a charge and the charging
      overvoltage make any pack look fuller than it is (with 30 min,
      on 26 Sep a pack at ~7% read 25.8V after a 1.5h charge and the
      count was pulled up to 11%). The flags matter because a phantom
      +1A keeps the charge power above 0 for hours, which used to
      switch the correction off exactly when the pack was draining;
    - clearly disagrees: the PI30 reports voltage in 0.1V steps, so
      the table is read at voltage_ocv - 0.15V and + 0.15V, giving a
      band of SOCs the voltage is compatible with. Inside the band
      nothing happens (the count is more precise than the voltage);
      outside, the count moves towards the nearest edge of the band
      with a 5-minute time constant (about 1/5 of the gap per minute):
      a wrong value is fixed within about 15 minutes, and a single odd
      reading moves it only a little.
  On the flat top of the curve (70-99%) the band is 25-30 points wide
  and the voltage almost never overrides the count; below 50% it is
  10-15 points wide, and below 10% (the knee: 25.0V is 6%, 24.0V is
  2%) it is a few points, so there the voltage leads. Example: 26.3V
  at -9A is 26.41V compensated (real current -10.9A with the idle
  drain), band 33-64%: a counter stuck at 96% comes down to about 65%
  in about 15 minutes, then the count takes over again.
  The table (ocv_v / ocv_soc) was measured on this pack from 0% to
  99%: SOC reconstructed with the calibrated count over the full ->
  empty -> full cycle of 22-23 Sep 2026, voltage fitted against SOC
  and real current (resistance 10 mOhm, residual about 0.06V), median
  compensated voltage per 5% of SOC, and per minute in the last five
  hours before the BMS cut (25.1V -> 22.7V at rest). The steady-state
  resistance used here, correction_resistance_ohm = 0.010, is slightly
  higher than internal_resistance_ohm = 0.0095 of the anchors because
  it includes the slow polarisation of a pack that has been delivering
  current for minutes, not just the instant drop.
  Near the two ends the band is widened to the end itself (a band
  reaching 99% counts as reaching 100%, one reaching 3% or less counts
  as reaching 0%), so the correction never lifts an anchored 0 while
  the battery is held at the under-voltage threshold by the charging
  automation (at 23.8-24.0V, where the table says 2%), nor lowers an
  anchored 100. The correction itself never writes exactly 100 or 0.
  ANCHORS. Only the two template triggers below may write exactly 100
  and exactly 0, to remove the drift of the count (and its wrong
  capacity/efficiency, if any), and each one fires only once its
  condition has held for a while ("for"), so a single odd reading (a
  load spike, surface charge right after the charger cut off at 80%)
  cannot re-anchor the counter. The thresholds are compared NOT against
  raw voltage but against a voltage "compensated" for the internal
  resistance drop (voltage_ocv = voltage - current *
  internal_resistance_ohm, same sign convention as the current sensor:
  positive while charging raises the measured voltage above the true
  OCV, negative while discharging lowers it), otherwise a battery still
  charging hard at high voltage would look full too early (and the
  opposite on discharge):
    - full_hold -> 100%: voltage_ocv >= the full threshold, AND the
      pack is not being pushed (current <= tail_current_a, 0 by
      default: idle or discharging), both true continuously for 5
      minutes. The full threshold is the HIGHER of (float voltage,
      sensor.heltec_pi30_display_pi30_battery_float_voltage, minus
      full_margin_v = 0.1V) and full_floor_v = 27.2V (3.40V per cell x
      8). The floor exists because the float voltage is whatever the
      inverter was programmed with: with a float of 26.8V or lower,
      "at float voltage" is the flat middle of the LiFePO4 curve
      (26.6V at rest is anywhere between 60% and 85%), and the anchor
      would certify a half-full pack as 100%. Below 3.40V per cell a
      resting LiFePO4 cell is not full, whatever the charger settings
      say. The second half is the meaningful test: if the pack holds
      the full voltage while nothing is charging it, that voltage comes
      from its own state of charge, so it really is full. A pack still
      swallowing current may just be held up there by the charger,
      whatever the voltage says - including the low-current case, since
      charging at 2A because there is no surplus is not the same thing
      as a charge that tapered off because the battery would take no
      more. And a count that says "3.9 kWh went in" is not evidence
      either: it stops at 99 and waits for this anchor.
      The inverter's own "charging to floating mode" flag is
      deliberately NOT used: it describes the charger's stage, not the
      battery, and the PI30 keeps it raised all night while the pack
      discharges; it used to pin this sensor at 100%.
    - empty_hold -> 0%: voltage_ocv <= under-voltage threshold
      (sensor.heltec_pi30_display_pi30_battery_under_voltage) plus
      empty_margin_v (0.2V, headroom before the BMS itself disconnects
      the battery), continuously for 1 minute.
  A template trigger fires on the false -> true transition of its
  condition, so each anchor writes once per episode; the counter then
  holds the value on its own and re-anchors the next time the
  condition is re-established. Each anchor also writes a Logbook entry
  with the readings it fired on (voltage, current, thresholds, both
  lifetime energy counters, previous SOC), so a wrong 100% or 0% can
  be traced to its moment and capacity/efficiency can be calibrated
  from two consecutive anchors (Logbook, filter on the helper entity).
  If the pack is already full (or empty) when this automation is
  loaded, the anchor waits for the next episode: set the helper by
  hand once, as the README says.
  CONSTANTS live in trigger_variables (used by the two anchor
  triggers; Home Assistant does not expose them to the actions) and in
  actions > variables (capacity, efficiency, time cap). full_floor_v =
  27.2 (V): change it only for a different chemistry or cell count
  (3.40V per cell for LiFePO4); it is repeated in actions > variables
  for the float test of the counting, keep the two equal. tail_current_a = 2 (A), MEASURED: once
  bulk ends (29.0V) this inverter parks the pack at its 27.5V float
  and keeps reporting +2A (536 of the 587 minutes spent above 27.4V
  in the history show exactly 2A, 48 show 1A, one single minute shows
  0A), a reading the full pack cannot really be absorbing for five
  hours. With 0A the 100% anchor never fired. 2A is also the smallest
  charging step the charging automation can set, and with the 27.4V
  threshold that is safe: a pack held at or above 27.4V while taking
  no more than 2A is full. Do not raise it further, or a deliberate
  low-current charge would be mistaken for a tapered one.
  internal_resistance_ohm = 0.0095 (9.5 mOhm), calibrated on the real
  pack: derived from 19 (voltage, current) pairs found in the JK BMS
  exported log ("Cell over charge protection" -> "released" events 2-3
  seconds apart, same SOC), R = weighted average of dV/dI. See the
  repository's main README.md ("Home Assistant automations" section,
  "Real SOC via energy counting") for the method and how to recompute
  it if the pack changes. The hold times are the "for" of each anchor
  trigger. The cadence trigger can be changed freely: the elapsed time
  is measured, nothing else depends on it.
trigger_variables:
  tail_current_a: 2
  internal_resistance_ohm: 0.0095
  full_margin_v: 0.1
  full_floor_v: 27.2
  empty_margin_v: 0.2
triggers:
  - trigger: time_pattern
    id: cadence
    minutes: /1
  - trigger: homeassistant
    id: startup
    event: start
  - trigger: template
    id: full_hold
    value_template: >-
      {% set voltage = states('sensor.heltec_pi30_battery_voltage') | float(default=none) %}
      {% set current = states('sensor.heltec_pi30_battery_current') | float(default=none) %}
      {% set float_voltage = states('sensor.heltec_pi30_display_pi30_battery_float_voltage') | float(default=none) %}
      {% set full_threshold = ([float_voltage - full_margin_v, full_floor_v] | max) if float_voltage is not none else full_floor_v %}
      {{ voltage is not none and current is not none
         and current <= tail_current_a
         and (voltage - current * internal_resistance_ohm) >= full_threshold }}
    for: "00:05:00"
  - trigger: template
    id: empty_hold
    value_template: >-
      {% set voltage = states('sensor.heltec_pi30_battery_voltage') | float(default=none) %}
      {% set current = states('sensor.heltec_pi30_battery_current') | float(default=none) %}
      {% set under_voltage = states('sensor.heltec_pi30_display_pi30_battery_under_voltage') | float(default=none) %}
      {{ voltage is not none and current is not none and under_voltage is not none
         and (voltage - current * internal_resistance_ohm) <= (under_voltage + empty_margin_v) }}
    for: "00:01:00"
conditions: []
actions:
  - variables:
      capacity_kwh: 3.9
      charge_efficiency: 0.87
      max_dt_hours: "{{ 5 / 60 }}"
      correction_resistance_ohm: 0.010
      idle_drain_w: 50
      correction_band_v: 0.15
      correction_tau_min: 5
      correction_max_current_a: 30
      correction_rest_min: 60
      small_charge_w: 60
      full_floor_v: 27.2
      ocv_v: [22.70, 23.40, 24.00, 24.50, 25.00, 25.60, 25.76, 25.96, 26.10, 26.22, 26.30, 26.36, 26.42, 26.47, 26.52, 26.57, 26.63, 26.67, 26.69, 26.71, 26.73, 26.75]
      ocv_soc: [0, 1, 2, 4, 6, 9, 15, 20, 25, 30, 37, 43, 50, 55, 60, 65, 70, 75, 82, 90, 95, 99]
      voltage: >-
        {{ states('sensor.heltec_pi30_battery_voltage') | float(default=none)
        }}
      current: >-
        {{ states('sensor.heltec_pi30_battery_current') | float(default=none)
        }}
      charge_kw: >-
        {% set p = states('sensor.heltec_pi30_batteria_potenza_carica') | float(default=none) %}
        {% set unit = state_attr('sensor.heltec_pi30_batteria_potenza_carica', 'unit_of_measurement') %}
        {{ none if p is none else (p if unit == 'kW' else p / 1000) }}
      discharge_kw: >-
        {% set p = states('sensor.heltec_pi30_batteria_potenza_scarica') | float(default=none) %}
        {% set unit = state_attr('sensor.heltec_pi30_batteria_potenza_scarica', 'unit_of_measurement') %}
        {{ none if p is none else (p if unit == 'kW' else p / 1000) }}
      charging: >-
        {{ charge_kw is not none and charge_kw * 1000 > small_charge_w }}
      at_float: >-
        {{ not charging and voltage is not none and voltage >= full_floor_v
           and discharge_kw is not none and discharge_kw == 0 }}
      soc_now: >-
        {{ states('input_number.pi30_battery_soc_calculated') |
        float(default=50) }}
      dt_hours: >-
        {% set last = this.attributes.last_triggered if this is not none else none %}
        {% set ts = as_timestamp(last, default=none) if last is not none else none %}
        {{ 0 if ts is none else ([(now().timestamp() - ts) / 3600, max_dt_hours] | min) }}
      charger_off_long_enough: >-
        {% set rest_s = correction_rest_min * 60 %}
        {% set s = states.sensor.heltec_pi30_batteria_potenza_carica %}
        {% set zero_long = s is not none and (s.state | float(default=1)) == 0
           and (now() - s.last_changed).total_seconds() >= rest_s %}
        {% set ac = states.binary_sensor.heltec_pi30_display_pi30_ac_charging %}
        {% set scc = states.binary_sensor.heltec_pi30_display_pi30_scc_charging %}
        {% set flags_off_long = ac is not none and scc is not none
           and ac.state == 'off' and scc.state == 'off'
           and (now() - ac.last_changed).total_seconds() >= rest_s
           and (now() - scc.last_changed).total_seconds() >= rest_s %}
        {{ charge_kw is not none and not charging and (zero_long or flags_off_long) }}
      voltage_band: >-
        {% macro soc_at(v) -%}
          {%- set ns = namespace(r=none) -%}
          {%- if v <= ocv_v[0] -%}{%- set ns.r = ocv_soc[0] -%}
          {%- elif v >= ocv_v[-1] -%}{%- set ns.r = ocv_soc[-1] -%}
          {%- else -%}
            {%- for i in range(1, ocv_v | length) -%}
              {%- if ns.r is none and v <= ocv_v[i] -%}
                {%- set ns.r = ocv_soc[i-1] + (ocv_soc[i] - ocv_soc[i-1]) * (v - ocv_v[i-1]) / (ocv_v[i] - ocv_v[i-1]) -%}
              {%- endif -%}
            {%- endfor -%}
          {%- endif -%}
          {{- ns.r -}}
        {%- endmacro %}
        {% if voltage is none or current is none or not charger_off_long_enough
              or at_float or current < -correction_max_current_a %}
          {{ none }}
        {% else %}
          {% set real_current = ([current, 0] | min) - idle_drain_w / voltage %}
          {% set v_ocv = voltage - real_current * correction_resistance_ohm %}
          {% set lo = soc_at(v_ocv - correction_band_v) | float %}
          {% set hi = soc_at(v_ocv + correction_band_v) | float %}
          {{ [0 if lo <= 3 else lo, 100 if hi >= 99 else hi] }}
        {% endif %}
      readings: >-
        V={{ states('sensor.heltec_pi30_battery_voltage') }}V
        I={{ states('sensor.heltec_pi30_battery_current') }}A
        float={{ states('sensor.heltec_pi30_display_pi30_battery_float_voltage') }}V
        under={{ states('sensor.heltec_pi30_display_pi30_battery_under_voltage') }}V
        charged={{ states('sensor.heltec_pi30_batteria_energia_caricata') }}
        discharged={{ states('sensor.heltec_pi30_batteria_energia_scaricata') }}
        soc_before={{ states('input_number.pi30_battery_soc_calculated') }}
  - choose:
      - conditions:
          - condition: trigger
            id: full_hold
        sequence:
          - target:
              entity_id: input_number.pi30_battery_soc_calculated
            data:
              value: 100
            action: input_number.set_value
          - action: logbook.log
            data:
              name: PI30 Battery SOC
              entity_id: input_number.pi30_battery_soc_calculated
              message: "anchored to 100% after 5 min at full threshold ({{ readings }})"
      - conditions:
          - condition: trigger
            id: empty_hold
        sequence:
          - target:
              entity_id: input_number.pi30_battery_soc_calculated
            data:
              value: 0
            action: input_number.set_value
          - action: logbook.log
            data:
              name: PI30 Battery SOC
              entity_id: input_number.pi30_battery_soc_calculated
              message: "anchored to 0% after 1 min at empty threshold ({{ readings }})"
    default:
      - if:
          - condition: template
            value_template: "{{ charge_kw is none or discharge_kw is none or dt_hours <= 0 }}"
        then:
          - stop: Battery power unavailable or no elapsed time, no update
      - target:
          entity_id: input_number.pi30_battery_soc_calculated
        data:
          value: >-
            {% set charge_in = charge_kw if charging else 0 %}
            {% set drain_kw = discharge_kw + (0 if charging or at_float else idle_drain_w / 1000) %}
            {% set delta = (charge_in * charge_efficiency - drain_kw) * dt_hours / capacity_kwh * 100 %}
            {% if delta > 0 %}
              {% set counted = [soc_now + delta, 99] | min %}
            {% elif delta < 0 %}
              {% set counted = [soc_now + delta, [1, soc_now] | min] | max %}
            {% else %}
              {% set counted = soc_now %}
            {% endif %}
            {% if voltage_band is none %}
              {{ counted | round(3) }}
            {% else %}
              {% set target = [[counted, voltage_band[0]] | max, voltage_band[1]] | min %}
              {% set gain = 1 - e ** (-(dt_hours * 60) / correction_tau_min) %}
              {% set corrected = counted + gain * (target - counted) %}
              {{ [[corrected, [1, counted] | min] | max, [99, counted] | max] | min | round(3) }}
            {% endif %}
        action: input_number.set_value
mode: single
max_exceeded: silent
