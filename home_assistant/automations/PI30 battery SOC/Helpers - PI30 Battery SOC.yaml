# =====================================================================
# Helper "PI30 battery SOC calcolato" (input_number)
# =====================================================================
#
# Non e' un'automazione importabile da UI: e' l'helper che fa da
# "memoria" del coulomb counting fatto dall'automazione
# "Automation - PI30 Battery SOC Coulomb Counting.yaml".
#
# COME CREARLO (scegli UNA delle due strade):
#
# 1) Da UI (consigliato): Impostazioni > Dispositivi e servizi > Helper
#    > Crea helper > Numero, e compila:
#      Nome:        PI30 battery SOC calcolato
#      Icona:       mdi:battery-unknown
#      Valore min:  0
#      Valore max:  100
#      Passo:       0.1
#      Unita' di misura: %
#      Modalita' di visualizzazione: Casella di testo
#    Al primo salvataggio imposta come valore iniziale il SOC letto da
#    sensor.heltec_pi30_battery_soc (o una stima a occhio), cosi' parte
#    gia' vicino al valore vero: l'automazione lo ricalibrera' comunque
#    al primo passaggio per la tensione di float o di under-voltage.
#    Questo crea l'entita' input_number.pi30_battery_soc_calcolato
#    (verifica l'entity_id esatto dopo la creazione: se non coincide,
#    aggiorna i riferimenti nell'automazione e nel sensore template).
#
# 2) Da configuration.yaml (se preferisci gestire gli helper in YAML,
#    serve poi riavviare Home Assistant o ricaricare gli input_number):
input_number:
  pi30_battery_soc_calcolato:
    name: PI30 battery SOC calcolato
    icon: mdi:battery-unknown
    min: 0
    max: 100
    step: 0.1
    unit_of_measurement: "%"
    mode: box
    initial: 50

# NOTA SUL RIAVVIO DI HOME ASSISTANT:
# gli input_number non garantiscono il ripristino del valore dopo un
# riavvio in tutte le configurazioni: se dopo un riavvio riparte dal
# valore "initial" invece che dall'ultimo valore calcolato, non e' un
# problema grave, perche' l'automazione ricalibra comunque la stima a
# 100% o 0% ogni volta che la batteria tocca la tensione di float o la
# soglia di under-voltage + margine (vedi README.md).
