alias: PI30 Battery SOC Ricalibra da tensione
description: >-
  ATTENZIONE: lanciarlo UNA VOLTA SOLA, subito dopo aver creato
  l'Helper 1 (o dopo un reset/deriva evidente del contatore). NON
  rilanciarlo di routine: essendo una retta tra due punti, vicino agli
  estremi e' molto sensibile (pochi decimi di volt spostano parecchi
  punti percentuali), e rilanciarlo ogni volta che la tensione sale
  un po' riporta il SOC a essere di fatto basato sulla sola tensione
  istantanea, vanificando il senso di avere il coulomb counting.
  Dopo il primo lancio, lascia lavorare solo l'automazione "PI30
  Battery SOC Coulomb Counting", che integra la corrente ogni 2
  minuti: e' quella il SOC vero, questo script serve solo a darle un
  punto di partenza decente invece di 0%.
  Reimposta input_number.pi30_battery_soc_calcolato interpolando
  linearmente, tra i due estremi reali gia' configurati sull'inverter
  (soglia di under-voltage + 0.2V = 0%, tensione di float - 0.1V =
  100%), non la tensione grezza ma quella compensata per la caduta
  resistiva interna: voltage_ocv = voltage - current *
  internal_resistance_ohm (stessa convenzione di segno del sensore
  corrente: positiva in carica, negativa in scarica), altrimenti la
  stessa tensione dava stime molto diverse a seconda di quanti Ampere
  stava assorbendo/erogando la batteria in quel momento.
  internal_resistance_ohm = 0.0095 (9.5 mOhm), tarato sul pacco reale
  dal log del BMS JK (vedi README.md, sezione taratura resistenza
  interna, per il metodo e per ricalcolarlo se cambia il pacco).
  E' comunque una stima grezza a "retta", non la vera curva a S del
  LiFePO4.
  Da Impostazioni > Automazioni e scene > Script, oppure aggiungi un
  pulsante/scena in dashboard che chiama script.turn_on su questo
  script.
sequence:
  - variables:
      internal_resistance_ohm: 0.0095
      voltage: >-
        {{ states('sensor.heltec_pi30_battery_voltage') | float(default=none)
        }}
      current: >-
        {{ states('sensor.heltec_pi30_battery_current') | float(default=none)
        }}
      float_voltage: >-
        {{
        states('sensor.heltec_pi30_display_pi30_battery_float_voltage') |
        float(default=none) }}
      under_voltage: >-
        {{
        states('sensor.heltec_pi30_display_pi30_battery_under_voltage') |
        float(default=none) }}
      empty_v: '{{ (under_voltage + 0.2) if under_voltage is not none else none }}'
      full_v: '{{ (float_voltage - 0.1) if float_voltage is not none else none }}'
  - if:
      - condition: template
        value_template: >-
          {{ voltage is none or current is none or empty_v is none or full_v
          is none or full_v <= empty_v }}
    then:
      - stop: Dati mancanti o soglie incoerenti, nessuna ricalibrazione
  - variables:
      voltage_ocv: '{{ voltage - (current * internal_resistance_ohm) }}'
  - target:
      entity_id: input_number.pi30_battery_soc_calcolato
    data:
      value: >-
        {{ min(max(((voltage_ocv - empty_v) / (full_v - empty_v)) * 100, 0),
        100) | round(1) }}
    action: input_number.set_value
mode: single
