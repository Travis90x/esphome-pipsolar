# =====================================================================
# Sensore template "PI30 battery SoC calcolato"
# =====================================================================
#
# Non e' un'automazione: va in configuration.yaml sotto la chiave
# `template:` (o in un file separato incluso da li'). Espone come
# sensore vero e proprio (device_class: battery, cosi' compare anche
# nei grafici energia/batteria di Home Assistant) il valore calcolato
# dall'automazione di coulomb counting, che altrimenti resterebbe solo
# un input_number "tecnico".
#
# Richiede l'helper input_number.pi30_battery_soc_calcolato creato da
# "Helpers - PI30 Battery SOC.yaml".

template:
  - sensor:
      - name: PI30 battery SoC calcolato
        unique_id: pi30_battery_soc_calcolato
        icon: mdi:battery-unknown
        unit_of_measurement: "%"
        device_class: battery
        state_class: measurement
        availability: >-
          {{ states('input_number.pi30_battery_soc_calcolato') not in
          ['unknown', 'unavailable'] }}
        state: >-
          {{ states('input_number.pi30_battery_soc_calcolato') |
          float(default=0) | round(0) }}
