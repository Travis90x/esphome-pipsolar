# Facoltativo. La modalità della PI30 come un valore fisso, da mettere in
# dashboard e nello storico al posto degli script: uno script è "on" solo
# per pochi istanti mentre gira.
#
#   SCARICAMENTO IN RETE     la batteria alimenta le prese della PI30
#                            (Battery mode) ed Enel c'è: si scarica fino alla
#                            tensione di recharge, poi le prese passano su Enel
#   SCARICAMENTO FUORI RETE  la batteria alimenta le prese ed Enel manca
#                            (tensione di rete letta dalla PI30 sotto 100V): si
#                            scarica fino allo stacco di emergenza (under voltage)
#   BATTERIA SCARICA         prese su Enel, batteria tenuta alla tensione minima
#                            (input_number.pi30_keep_battery_live): uscita "rete"
#                            con il bulk sotto la metà tra minimo e bulk di
#                            carica, oppure uscita SBU già in Line mode
#   CARICAMENTO BULK         in carica (uscita "rete", caricabatterie "solare +
#                            rete", bulk di carica), flag di float spento
#   CARICAMENTO Float        in carica, flag di float acceso, corrente > 2A
#   BATTERIA CARICA          in carica, flag di float acceso, corrente <= 2A
#                            (attenzione: anche un float anticipato a 2A finisce qui)
#   ALTRO                    priorità impostate a mano in un'altra combinazione
#
# Nomi in uso dall'08/11/2026 (prima: IN CARICA, IN SCARICA, MANTENIMENTO).
#
# La PI30 senza rete in CARICA non si vede qui: la segnala la notifica
# "PI30 non sta usando la rete" dell'automazione.
#
# NON incollare questo file in un editor YAML. Da interfaccia:
#   Impostazioni > Dispositivi e servizi > Aiutanti > Crea aiutante >
#   Template > Sensore
#   Nome: PI30 Modalità MAN
#   Unità di misura, classe del dispositivo, classe di stato: vuote
#   Modello di stato: solo il template dopo "state: >-", senza i rientri
# Dopo il salvataggio apri l'aiutante, icona ingranaggio, e cambia l'ID
# entità in sensor.pi30_man_mode (il nome italiano ne produce un altro, che
# l'automazione non trova). Se l'avevi già con l'ID vecchio
# (sensor.heltec_pi30_display_pi30_modalita_man), cambia lì l'ID entità e
# incolla il modello di stato nuovo (usa gli ID nuovi del firmware).
#
# Oppure, solo in configuration.yaml (poi riavvia). default_entity_id fissa
# l'ID entità, che altrimenti verrebbe dal nome:
template:
  - sensor:
      - name: PI30 Modalità MAN
        default_entity_id: sensor.pi30_man_mode
        unique_id: pi30_modalita_man
        icon: mdi:battery-sync
        state: >-
          {% set o = states('sensor.pi30_output_source_priority') | float(-1) %}
          {% set c = states('sensor.pi30_charger_source_priority') | float(-1) %}
          {% set minimo = [states('input_number.pi30_keep_battery_live') | float(25.5), 24.0] | max %}
          {% set bulk_carica = states('input_number.pi30_charge_bulk_voltage') | float(29.0) %}
          {% set bulk = states('sensor.pi30_battery_bulk_voltage') | float(0) %}
          {% set modo = states('sensor.pi30_device_mode') %}
          {% set rete_v = states('sensor.pi30_grid_voltage') | float(0) %}
          {% set flag_float = is_state('binary_sensor.pi30_charging_to_floating_mode', 'on') %}
          {% set corrente = states('sensor.pi30_battery_charging_current') | float(0) %}
          {% if modo == 'Battery mode' and rete_v < 100 %}SCARICAMENTO FUORI RETE
          {% elif modo == 'Battery mode' %}SCARICAMENTO IN RETE
          {% elif (o == 0 and c == 2 and bulk < (minimo + bulk_carica) / 2) or (o == 2 and modo == 'Line mode') %}BATTERIA SCARICA
          {% elif o == 0 and c == 2 and not flag_float %}CARICAMENTO BULK
          {% elif o == 0 and c == 2 and corrente > 2 %}CARICAMENTO Float
          {% elif o == 0 and c == 2 %}BATTERIA CARICA
          {% else %}ALTRO{% endif %}
        availability: >-
          {{ has_value('sensor.pi30_output_source_priority')
             and has_value('sensor.pi30_charger_source_priority') }}
