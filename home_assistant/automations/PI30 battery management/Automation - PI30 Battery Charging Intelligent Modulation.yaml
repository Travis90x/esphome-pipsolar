alias: PI30 Battery MAN
description: >-
  Logica umana completa: vedi il README.md principale del repository,
  sezione "Modulazione dinamica della carica da rete" (README_IT.md per
  la versione italiana). Per limitare manualmente lo step massimo
  raggiungibile dalla
  modulazione, modifica il valore di MAX_MANUAL_CURRENT nella variabile
  max_manual_current qui sotto (riga "action > variables") e salva
  l'automazione.
  MANTENIMENTO ALLA SOTTOTENSIONE. Quando la tensione della batteria PI30
  scende a sensor.heltec_pi30_display_pi30_battery_under_voltage (la
  soglia di sottotensione letta dall'inverter), invece di SCARICA viene
  eseguito MANTIENI (script.pi30_batteria_da_mantenere): SBU, carica
  "solare + rete" e corrente massima da rete fissa a 10A. In SBU a quella
  tensione l'inverter è già in Line mode (i carichi vanno sulla rete), ma
  il suo autoconsumo, circa 50W, esce comunque dalla batteria e la
  porterebbe fino allo stacco del BMS, che spegne l'inverter (successo il
  23/09/2026 alle 10:00, il 25/09 alle 22:00 e il 26/09 alle 04:29 ora
  italiana, sempre a 22.7-22.8V). 2A non bastano: il 26/09 dalle 04:02
  alle 04:29 l'inverter segnava +2A mentre la batteria scendeva da 23.6V
  a 22.8V. Con 10A la batteria risale di qualche decimo di volt in pochi
  minuti; il mantenimento resta attivo finché la tensione non sale di
  hold_release_margin_v (0.5V) sopra la soglia, poi torna SCARICA, e
  riparte se la tensione ridiscende alla soglia: dalla rete si preleva
  solo quello che l'inverter consuma, non una ricarica. ATTENZIONE: il
  mantenimento funziona solo se questa automazione è ATTIVA; il 25/09
  era disattivata dalle 15:20 alle 01:41 e alla soglia non è intervenuto
  nulla. La carica vera resta affidata al surplus, cioè ai rami di
  CARICA qui sopra. Il trigger sotto_tensione fa intervenire
  l'automazione entro un minuto dal raggiungimento della soglia, senza
  aspettare il controllo dei 10 minuti. Se la soglia non è leggibile si
  usa 24.0V, per sicurezza.
triggers:
  - trigger: homeassistant
    id: avvio
    event: start
  - trigger: time_pattern
    id: controllo_10_minuti
    minutes: /10
  - trigger: state
    id: batteria_stabile
    entity_id:
      - sensor.goodwe_battery_state_of_charge
      - sensor.goodwe_battery_voltage
      - sensor.potenza_contatore
      - sensor.goodwe_battery_power
    for:
      hours: 0
      minutes: 0
      seconds: 10
  - trigger: template
    id: sotto_tensione
    value_template: >-
      {{ states('sensor.heltec_pi30_battery_voltage') | float(99) <=
      states('sensor.heltec_pi30_display_pi30_battery_under_voltage') |
      float(24.0) }}
    for:
      minutes: 1
actions:
  - variables:
      charging_steps:
        - 2
        - 10
        - 20
        - 30
        - 40
        - 50
        - 60
      max_manual_current: 40
      soc: >-
        {{ states('sensor.goodwe_battery_state_of_charge') | float(default=none)
        }}
      voltage: '{{ states(''sensor.goodwe_battery_voltage'') | float(default=none) }}'
      grid_power: '{{ states(''sensor.potenza_contatore'') | float(default=none) }}'
      battery_power: '{{ states(''sensor.goodwe_battery_power'') | float(default=none) }}'
      current_utility: >-
        {{
        states('sensor.heltec_pi30_display_pi30_max_utility_charging_current') |
        int(default=0) }}
      current_total: >-
        {{ states('sensor.heltec_pi30_display_pi30_max_total_charging_current')
        | int(default=0) }}
      soc_known: '{{ soc is not none }}'
      volt_known: '{{ voltage is not none }}'
      power_known: '{{ grid_power is not none and battery_power is not none }}'
      sensors_unknown: '{{ soc is none or voltage is none }}'
      pi30_voltage: '{{ states(''sensor.heltec_pi30_battery_voltage'') | float(default=none) }}'
      under_voltage: >-
        {{ states('sensor.heltec_pi30_display_pi30_battery_under_voltage') |
        float(default=24.0) }}
      hold_release_margin_v: 0.5
      hold_active: >-
        {{ states('sensor.heltec_pi30_display_pi30_output_source_priority') |
        float(0) == 2.0 and
        states('sensor.heltec_pi30_display_pi30_charger_source_priority') |
        float(0) == 2.0 }}
      hold_needed: >-
        {{ pi30_voltage is not none and (pi30_voltage <= under_voltage or
        (hold_active and pi30_voltage < under_voltage + hold_release_margin_v)) }}
  - if:
      - condition: template
        value_template: '{{ soc_known and soc > 99 }}'
    then:
      - target:
          entity_id: script.pi30_batteria_da_caricare
        action: script.turn_on
      - if:
          - condition: template
            value_template: '{{ current_total < 60 }}'
        then:
          - target:
              entity_id: select.heltec_pi30_display_pi30_set_max_total_charging_current
            data:
              option: '60'
            action: select.select_option
        else: []
      - if:
          - condition: template
            value_template: '{{ current_utility > max_manual_current }}'
        then:
          - target:
              entity_id: select.heltec_pi30_display_pi30_set_max_utility_charging_current
            data:
              option: >-
                {{ (charging_steps | select('le', max_manual_current) | list |
                max) | string
                   if (charging_steps | select('le', max_manual_current) | list | length > 0) else '2' }}
            action: select.select_option
          - delay: '00:00:10'
        else:
          - if:
              - condition: template
                value_template: >-
                  {{ grid_power is not none and battery_power is not none and
                  grid_power < 300 and battery_power < 200 }}
            then:
              - target:
                  entity_id: >-
                    select.heltec_pi30_display_pi30_set_max_utility_charging_current
                data:
                  option: >-
                    {{ ((charging_steps | select('gt', current_utility) |
                    select('le', max_manual_current) | list) | min)
                       if (charging_steps | select('gt', current_utility) | select('le', max_manual_current) | list | length > 0)
                       else (charging_steps | select('le', max_manual_current) | list | max) | string }}
                action: select.select_option
              - delay: '00:00:10'
            else:
              - target:
                  entity_id: >-
                    select.heltec_pi30_display_pi30_set_max_utility_charging_current
                data:
                  option: >-
                    {{ ((charging_steps | select('lt', current_utility) | list |
                    max)
                        if (charging_steps | select('lt', current_utility) | list | length > 0)
                        else (charging_steps | min)) | string }}
                action: select.select_option
              - delay: '00:00:10'
    else:
      - if:
          - condition: template
            value_template: '{{ volt_known and voltage >= 55 }}'
        then:
          - target:
              entity_id: script.pi30_batteria_da_caricare
            action: script.turn_on
          - if:
              - condition: template
                value_template: '{{ current_total < 60 }}'
            then:
              - target:
                  entity_id: >-
                    select.heltec_pi30_display_pi30_set_max_total_charging_current
                data:
                  option: '60'
                action: select.select_option
            else: []
          - if:
              - condition: template
                value_template: '{{ current_utility > max_manual_current }}'
            then:
              - target:
                  entity_id: >-
                    select.heltec_pi30_display_pi30_set_max_utility_charging_current
                data:
                  option: >-
                    {{ (charging_steps | select('le', max_manual_current) | list
                    | max) | string
                       if (charging_steps | select('le', max_manual_current) | list | length > 0) else '2' }}
                action: select.select_option
              - delay: '00:00:10'
            else:
              - if:
                  - condition: template
                    value_template: >-
                      {{ grid_power is not none and battery_power is not none
                      and grid_power < 300 and battery_power < 200 }}
                then:
                  - target:
                      entity_id: >-
                        select.heltec_pi30_display_pi30_set_max_utility_charging_current
                    data:
                      option: >-
                        {{ ((charging_steps | select('gt', current_utility) |
                        select('le', max_manual_current) | list) | min)
                           if (charging_steps | select('gt', current_utility) | select('le', max_manual_current) | list | length > 0)
                           else (charging_steps | select('le', max_manual_current) | list | max) | string }}
                    action: select.select_option
                  - delay: '00:00:10'
                else:
                  - target:
                      entity_id: >-
                        select.heltec_pi30_display_pi30_set_max_utility_charging_current
                    data:
                      option: >-
                        {{ ((charging_steps | select('lt', current_utility) |
                        list | max)
                            if (charging_steps | select('lt', current_utility) | list | length > 0)
                            else (charging_steps | min)) | string }}
                    action: select.select_option
                  - delay: '00:00:10'
        else:
          - if:
              - condition: template
                value_template: '{{ soc_known and volt_known and soc > 99 and voltage < 53 }}'
            then:
              - target:
                  entity_id: script.pi30_batteria_da_caricare
                action: script.turn_on
              - if:
                  - condition: template
                    value_template: '{{ current_total < 60 }}'
                then:
                  - target:
                      entity_id: >-
                        select.heltec_pi30_display_pi30_set_max_total_charging_current
                    data:
                      option: '60'
                    action: select.select_option
                else: []
              - if:
                  - condition: template
                    value_template: '{{ current_utility > max_manual_current }}'
                then:
                  - target:
                      entity_id: >-
                        select.heltec_pi30_display_pi30_set_max_utility_charging_current
                    data:
                      option: >-
                        {{ (charging_steps | select('le', max_manual_current) |
                        list | max) | string
                           if (charging_steps | select('le', max_manual_current) | list | length > 0) else '2' }}
                    action: select.select_option
                  - delay: '00:00:10'
                else:
                  - if:
                      - condition: template
                        value_template: >-
                          {{ grid_power is not none and battery_power is not
                          none and grid_power < 300 and battery_power < 200 }}
                    then:
                      - target:
                          entity_id: >-
                            select.heltec_pi30_display_pi30_set_max_utility_charging_current
                        data:
                          option: >-
                            {{ ((charging_steps | select('gt', current_utility)
                            | select('le', max_manual_current) | list) | min)
                               if (charging_steps | select('gt', current_utility) | select('le', max_manual_current) | list | length > 0)
                               else (charging_steps | select('le', max_manual_current) | list | max) | string }}
                        action: select.select_option
                      - delay: '00:00:10'
                    else:
                      - target:
                          entity_id: >-
                            select.heltec_pi30_display_pi30_set_max_utility_charging_current
                        data:
                          option: >-
                            {{ ((charging_steps | select('lt', current_utility)
                            | list | max)
                                if (charging_steps | select('lt', current_utility) | list | length > 0)
                                else (charging_steps | min)) | string }}
                        action: select.select_option
                      - delay: '00:00:10'
            else:
              - if:
                  - condition: template
                    value_template: '{{ power_known }}'
                then:
                  - if:
                      - condition: template
                        value_template: >-
                          {{ current_utility == 2 and (grid_power < 500 and
                          battery_power < 200) }}
                    then:
                      - target:
                          entity_id: script.pi30_batteria_da_caricare
                        action: script.turn_on
                      - if:
                          - condition: template
                            value_template: '{{ current_total < 60 }}'
                        then:
                          - target:
                              entity_id: >-
                                select.heltec_pi30_display_pi30_set_max_total_charging_current
                            data:
                              option: '60'
                            action: select.select_option
                        else: []
                      - if:
                          - condition: template
                            value_template: '{{ current_utility > max_manual_current }}'
                        then:
                          - target:
                              entity_id: >-
                                select.heltec_pi30_display_pi30_set_max_utility_charging_current
                            data:
                              option: >-
                                {{ (charging_steps | select('le',
                                max_manual_current) | list | max) | string
                                   if (charging_steps | select('le', max_manual_current) | list | length > 0) else '2' }}
                            action: select.select_option
                          - delay: '00:00:10'
                        else:
                          - if:
                              - condition: template
                                value_template: >-
                                  {{ grid_power is not none and battery_power is
                                  not none and grid_power < 300 and
                                  battery_power < 200 }}
                            then:
                              - target:
                                  entity_id: >-
                                    select.heltec_pi30_display_pi30_set_max_utility_charging_current
                                data:
                                  option: >-
                                    {{ ((charging_steps | select('gt',
                                    current_utility) | select('le',
                                    max_manual_current) | list) | min)
                                       if (charging_steps | select('gt', current_utility) | select('le', max_manual_current) | list | length > 0)
                                       else (charging_steps | select('le', max_manual_current) | list | max) | string }}
                                action: select.select_option
                              - delay: '00:00:10'
                            else:
                              - target:
                                  entity_id: >-
                                    select.heltec_pi30_display_pi30_set_max_utility_charging_current
                                data:
                                  option: >-
                                    {{ ((charging_steps | select('lt',
                                    current_utility) | list | max)
                                        if (charging_steps | select('lt', current_utility) | list | length > 0)
                                        else (charging_steps | min)) | string }}
                                action: select.select_option
                              - delay: '00:00:10'
                    else:
                      - if:
                          - condition: template
                            value_template: >-
                              {{ sensors_unknown and grid_power < 300 and
                              battery_power < 200 }}
                        then:
                          - target:
                              entity_id: script.pi30_batteria_da_caricare
                            action: script.turn_on
                          - target:
                              entity_id: >-
                                select.heltec_pi30_display_pi30_set_max_utility_charging_current
                            data:
                              option: '2'
                            action: select.select_option
                        else:
                          - if:
                              - condition: template
                                value_template: >-
                                  {{ hold_needed }}
                            then:
                              # Batteria PI30 alla soglia di sottotensione: mantenere a 2A invece di scaricare
                              - target:
                                  entity_id: script.pi30_batteria_da_mantenere
                                action: script.turn_on
                            else:
                              - target:
                                  entity_id: script.pi30_batteria_da_scaricare
                                action: script.turn_on
                              - delay: '00:00:02'
                else:
                  - target:
                      entity_id: script.pi30_batteria_da_caricare
                    action: script.turn_on
                  - target:
                      entity_id: >-
                        select.heltec_pi30_display_pi30_set_max_utility_charging_current
                    data:
                      option: '2'
                    action: select.select_option
                  - if:
                      - condition: template
                        value_template: '{{ current_total < 60 }}'
                    then:
                      - target:
                          entity_id: >-
                            select.heltec_pi30_display_pi30_set_max_total_charging_current
                        data:
                          option: '60'
                        action: select.select_option
                    else: []
mode: single
max_exceeded: silent
