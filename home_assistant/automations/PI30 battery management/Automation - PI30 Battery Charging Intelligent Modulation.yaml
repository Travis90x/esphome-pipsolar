alias: PI30 Battery MAN
description: >-
  Logica umana completa: vedi il README.md principale del repository,
  sezione "Modulazione dinamica della carica da rete" (README_IT.md per
  la versione italiana). Per limitare manualmente lo step massimo
  raggiungibile dalla
  modulazione, modifica il valore di MAX_MANUAL_CURRENT nella variabile
  max_manual_current qui sotto (riga "action > variables") e salva
  l'automazione.
  MANTENIMENTO A 24V. SCARICA (script.pi30_batteria_da_scaricare) mette
  SBU, carica "solare + rete", bulk e float a 24.0V e corrente da rete
  almeno 40A: sopra 24V la batteria alimenta i carichi e il caricabatterie
  non eroga nulla; quando in SBU l'inverter passa alla rete, il
  caricabatterie la porta a 24.0V e la tiene lì, coprendo l'autoconsumo
  dell'inverter (circa 50W) che altrimenti la porterebbe allo stacco del
  BMS (23/09/2026 alle 10:00, 25/09 alle 22:00 e 26/09 alle 04:29 ora
  italiana, sempre a 22.7-22.8V). CARICA riporta bulk e float ai valori
  normali. Il primo controllo di ogni esecuzione resta la soglia di
  sottotensione sensor.heltec_pi30_display_pi30_battery_under_voltage: se
  la batteria PI30 è a quella tensione o sotto viene eseguito MANTIENI
  (script.pi30_batteria_da_mantenere, identico a SCARICA) al posto di
  qualsiasi altro ramo, anche di una CARICA a 2A che non basta. Il
  trigger sotto_tensione fa intervenire l'automazione entro un minuto dal
  raggiungimento della soglia. Se la soglia non è leggibile si usa 24.0V,
  per sicurezza. L'automazione deve restare sempre attiva: disattivata
  non protegge la batteria (il 25/09 era disattivata e il BMS ha spento
  l'inverter alle 22:00).
  RICARICA BATTERIA. Con l'aiutante input_boolean.pi30_ricarica_batteria
  ("Helper - PI30 Ricarica Batteria (Toggle).yaml") acceso, o assente, la
  batteria si ricarica con la logica normale. Spento: l'automazione esegue
  sempre SCARICA, cioè il mantenimento a 24V descritto qui sopra, e non
  carica mai la batteria oltre 24V.
triggers:
  - trigger: homeassistant
    id: avvio
    event: start
  - trigger: time_pattern
    id: controllo_10_minuti
    minutes: /10
  - trigger: state
    id: batteria_stabile
    entity_id:
      - sensor.goodwe_battery_state_of_charge
      - sensor.goodwe_battery_voltage
      - sensor.potenza_contatore
      - sensor.goodwe_battery_power
    for:
      hours: 0
      minutes: 0
      seconds: 10
  - trigger: template
    id: sotto_tensione
    value_template: >-
      {{ states('sensor.heltec_pi30_battery_voltage') | float(99) <=
      states('sensor.heltec_pi30_display_pi30_battery_under_voltage') |
      float(24.0) }}
    for:
      minutes: 1
  - trigger: state
    id: ricarica_batteria
    entity_id: input_boolean.pi30_ricarica_batteria
actions:
  - variables:
      charging_steps:
        - 2
        - 10
        - 20
        - 30
        - 40
        - 50
        - 60
      max_manual_current: 40
      soc: >-
        {{ states('sensor.goodwe_battery_state_of_charge') | float(default=none)
        }}
      voltage: '{{ states(''sensor.goodwe_battery_voltage'') | float(default=none) }}'
      grid_power: '{{ states(''sensor.potenza_contatore'') | float(default=none) }}'
      battery_power: '{{ states(''sensor.goodwe_battery_power'') | float(default=none) }}'
      current_utility: >-
        {{
        states('sensor.heltec_pi30_display_pi30_max_utility_charging_current') |
        int(default=0) }}
      current_total: >-
        {{ states('sensor.heltec_pi30_display_pi30_max_total_charging_current')
        | int(default=0) }}
      soc_known: '{{ soc is not none }}'
      volt_known: '{{ voltage is not none }}'
      power_known: '{{ grid_power is not none and battery_power is not none }}'
      sensors_unknown: '{{ soc is none or voltage is none }}'
      pi30_voltage: '{{ states(''sensor.heltec_pi30_battery_voltage'') | float(default=none) }}'
      under_voltage: >-
        {{ states('sensor.heltec_pi30_display_pi30_battery_under_voltage') |
        float(default=24.0) }}
      hold_needed: '{{ pi30_voltage is not none and pi30_voltage <= under_voltage }}'
  - if:
      - condition: template
        value_template: '{{ hold_needed }}'
    then:
      # Batteria PI30 alla soglia di sottotensione: MANTIENI (24V), prima di ogni altro ramo
      - target:
          entity_id: script.pi30_batteria_da_mantenere
        action: script.turn_on
      - stop: Batteria PI30 alla soglia di sottotensione, mantenimento
  - if:
      - condition: state
        entity_id: input_boolean.pi30_ricarica_batteria
        state: 'off'
    then:
      # Ricarica disattivata: sempre SCARICA, la protezione resta il MANTIENI qui sopra
      - target:
          entity_id: script.pi30_batteria_da_scaricare
        action: script.turn_on
      - stop: Ricarica disattivata, scarica
  - if:
      - condition: template
        value_template: '{{ soc_known and soc > 99 }}'
    then:
      - target:
          entity_id: script.pi30_batteria_da_caricare
        action: script.turn_on
      - if:
          - condition: template
            value_template: '{{ current_total < 60 }}'
        then:
          - target:
              entity_id: select.heltec_pi30_display_pi30_set_max_total_charging_current
            data:
              option: '60'
            action: select.select_option
        else: []
      - if:
          - condition: template
            value_template: '{{ current_utility > max_manual_current }}'
        then:
          - target:
              entity_id: select.heltec_pi30_display_pi30_set_max_utility_charging_current
            data:
              option: >-
                {{ (charging_steps | select('le', max_manual_current) | list |
                max) | string
                   if (charging_steps | select('le', max_manual_current) | list | length > 0) else '2' }}
            action: select.select_option
          - delay: '00:00:10'
        else:
          - if:
              - condition: template
                value_template: >-
                  {{ grid_power is not none and battery_power is not none and
                  grid_power < 300 and battery_power < 200 }}
            then:
              - target:
                  entity_id: >-
                    select.heltec_pi30_display_pi30_set_max_utility_charging_current
                data:
                  option: >-
                    {{ ((charging_steps | select('gt', current_utility) |
                    select('le', max_manual_current) | list) | min)
                       if (charging_steps | select('gt', current_utility) | select('le', max_manual_current) | list | length > 0)
                       else (charging_steps | select('le', max_manual_current) | list | max) | string }}
                action: select.select_option
              - delay: '00:00:10'
            else:
              - target:
                  entity_id: >-
                    select.heltec_pi30_display_pi30_set_max_utility_charging_current
                data:
                  option: >-
                    {{ ((charging_steps | select('lt', current_utility) | list |
                    max)
                        if (charging_steps | select('lt', current_utility) | list | length > 0)
                        else (charging_steps | min)) | string }}
                action: select.select_option
              - delay: '00:00:10'
    else:
      - if:
          - condition: template
            value_template: '{{ volt_known and voltage >= 55 }}'
        then:
          - target:
              entity_id: script.pi30_batteria_da_caricare
            action: script.turn_on
          - if:
              - condition: template
                value_template: '{{ current_total < 60 }}'
            then:
              - target:
                  entity_id: >-
                    select.heltec_pi30_display_pi30_set_max_total_charging_current
                data:
                  option: '60'
                action: select.select_option
            else: []
          - if:
              - condition: template
                value_template: '{{ current_utility > max_manual_current }}'
            then:
              - target:
                  entity_id: >-
                    select.heltec_pi30_display_pi30_set_max_utility_charging_current
                data:
                  option: >-
                    {{ (charging_steps | select('le', max_manual_current) | list
                    | max) | string
                       if (charging_steps | select('le', max_manual_current) | list | length > 0) else '2' }}
                action: select.select_option
              - delay: '00:00:10'
            else:
              - if:
                  - condition: template
                    value_template: >-
                      {{ grid_power is not none and battery_power is not none
                      and grid_power < 300 and battery_power < 200 }}
                then:
                  - target:
                      entity_id: >-
                        select.heltec_pi30_display_pi30_set_max_utility_charging_current
                    data:
                      option: >-
                        {{ ((charging_steps | select('gt', current_utility) |
                        select('le', max_manual_current) | list) | min)
                           if (charging_steps | select('gt', current_utility) | select('le', max_manual_current) | list | length > 0)
                           else (charging_steps | select('le', max_manual_current) | list | max) | string }}
                    action: select.select_option
                  - delay: '00:00:10'
                else:
                  - target:
                      entity_id: >-
                        select.heltec_pi30_display_pi30_set_max_utility_charging_current
                    data:
                      option: >-
                        {{ ((charging_steps | select('lt', current_utility) |
                        list | max)
                            if (charging_steps | select('lt', current_utility) | list | length > 0)
                            else (charging_steps | min)) | string }}
                    action: select.select_option
                  - delay: '00:00:10'
        else:
          - if:
              - condition: template
                value_template: '{{ soc_known and volt_known and soc > 99 and voltage < 53 }}'
            then:
              - target:
                  entity_id: script.pi30_batteria_da_caricare
                action: script.turn_on
              - if:
                  - condition: template
                    value_template: '{{ current_total < 60 }}'
                then:
                  - target:
                      entity_id: >-
                        select.heltec_pi30_display_pi30_set_max_total_charging_current
                    data:
                      option: '60'
                    action: select.select_option
                else: []
              - if:
                  - condition: template
                    value_template: '{{ current_utility > max_manual_current }}'
                then:
                  - target:
                      entity_id: >-
                        select.heltec_pi30_display_pi30_set_max_utility_charging_current
                    data:
                      option: >-
                        {{ (charging_steps | select('le', max_manual_current) |
                        list | max) | string
                           if (charging_steps | select('le', max_manual_current) | list | length > 0) else '2' }}
                    action: select.select_option
                  - delay: '00:00:10'
                else:
                  - if:
                      - condition: template
                        value_template: >-
                          {{ grid_power is not none and battery_power is not
                          none and grid_power < 300 and battery_power < 200 }}
                    then:
                      - target:
                          entity_id: >-
                            select.heltec_pi30_display_pi30_set_max_utility_charging_current
                        data:
                          option: >-
                            {{ ((charging_steps | select('gt', current_utility)
                            | select('le', max_manual_current) | list) | min)
                               if (charging_steps | select('gt', current_utility) | select('le', max_manual_current) | list | length > 0)
                               else (charging_steps | select('le', max_manual_current) | list | max) | string }}
                        action: select.select_option
                      - delay: '00:00:10'
                    else:
                      - target:
                          entity_id: >-
                            select.heltec_pi30_display_pi30_set_max_utility_charging_current
                        data:
                          option: >-
                            {{ ((charging_steps | select('lt', current_utility)
                            | list | max)
                                if (charging_steps | select('lt', current_utility) | list | length > 0)
                                else (charging_steps | min)) | string }}
                        action: select.select_option
                      - delay: '00:00:10'
            else:
              - if:
                  - condition: template
                    value_template: '{{ power_known }}'
                then:
                  - if:
                      - condition: template
                        value_template: >-
                          {{ current_utility == 2 and (grid_power < 500 and
                          battery_power < 200) }}
                    then:
                      - target:
                          entity_id: script.pi30_batteria_da_caricare
                        action: script.turn_on
                      - if:
                          - condition: template
                            value_template: '{{ current_total < 60 }}'
                        then:
                          - target:
                              entity_id: >-
                                select.heltec_pi30_display_pi30_set_max_total_charging_current
                            data:
                              option: '60'
                            action: select.select_option
                        else: []
                      - if:
                          - condition: template
                            value_template: '{{ current_utility > max_manual_current }}'
                        then:
                          - target:
                              entity_id: >-
                                select.heltec_pi30_display_pi30_set_max_utility_charging_current
                            data:
                              option: >-
                                {{ (charging_steps | select('le',
                                max_manual_current) | list | max) | string
                                   if (charging_steps | select('le', max_manual_current) | list | length > 0) else '2' }}
                            action: select.select_option
                          - delay: '00:00:10'
                        else:
                          - if:
                              - condition: template
                                value_template: >-
                                  {{ grid_power is not none and battery_power is
                                  not none and grid_power < 300 and
                                  battery_power < 200 }}
                            then:
                              - target:
                                  entity_id: >-
                                    select.heltec_pi30_display_pi30_set_max_utility_charging_current
                                data:
                                  option: >-
                                    {{ ((charging_steps | select('gt',
                                    current_utility) | select('le',
                                    max_manual_current) | list) | min)
                                       if (charging_steps | select('gt', current_utility) | select('le', max_manual_current) | list | length > 0)
                                       else (charging_steps | select('le', max_manual_current) | list | max) | string }}
                                action: select.select_option
                              - delay: '00:00:10'
                            else:
                              - target:
                                  entity_id: >-
                                    select.heltec_pi30_display_pi30_set_max_utility_charging_current
                                data:
                                  option: >-
                                    {{ ((charging_steps | select('lt',
                                    current_utility) | list | max)
                                        if (charging_steps | select('lt', current_utility) | list | length > 0)
                                        else (charging_steps | min)) | string }}
                                action: select.select_option
                              - delay: '00:00:10'
                    else:
                      - if:
                          - condition: template
                            value_template: >-
                              {{ sensors_unknown and grid_power < 300 and
                              battery_power < 200 }}
                        then:
                          - target:
                              entity_id: script.pi30_batteria_da_caricare
                            action: script.turn_on
                          - target:
                              entity_id: >-
                                select.heltec_pi30_display_pi30_set_max_utility_charging_current
                            data:
                              option: '2'
                            action: select.select_option
                        else:
                          - target:
                              entity_id: script.pi30_batteria_da_scaricare
                            action: script.turn_on
                          - delay: '00:00:02'
                else:
                  - target:
                      entity_id: script.pi30_batteria_da_caricare
                    action: script.turn_on
                  - target:
                      entity_id: >-
                        select.heltec_pi30_display_pi30_set_max_utility_charging_current
                    data:
                      option: '2'
                    action: select.select_option
                  - if:
                      - condition: template
                        value_template: '{{ current_total < 60 }}'
                    then:
                      - target:
                          entity_id: >-
                            select.heltec_pi30_display_pi30_set_max_total_charging_current
                        data:
                          option: '60'
                        action: select.select_option
                    else: []
mode: single
max_exceeded: silent
