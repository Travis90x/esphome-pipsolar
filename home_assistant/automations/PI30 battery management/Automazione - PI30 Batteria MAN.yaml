alias: PI30 Batteria MAN
description: >-
  Decide la modalità della PI30 in base al surplus fotovoltaico (contatore e
  batteria GoodWe) e regola la corrente di carica da rete. Spiegazione
  completa, con i casi dello storico: README_IT.md, sezione "Modulazione
  dinamica della carica da rete".
  TRE SCRIPT, chiamati per ID entità (l'automazione aspetta che finiscano).
  script.pi30_batteria_da_caricare (IN CARICA): uscita "rete prima", carica
  "solare + rete", bulk e float di carica; entra a 2A, poi la corrente la
  regola questa automazione. script.pi30_batteria_piena (PIENA): uscita "rete
  prima", carica "solo solare": batteria piena, carichi sul surplus, nessun
  nuovo bulk. script.pi30_batteria_da_scaricare (IN SCARICA e
  MANTENIMENTO): uscita SBU, carica "solare + rete", bulk e float alla
  tensione minima, 10A: la batteria alimenta i carichi finché scende alla
  tensione di recharge, poi la PI30 passa sulla rete e il caricabatterie la
  tiene alla tensione minima, coprendo solo l'autoconsumo.
  ORDINE DEI CONTROLLI. 1) Ricarica spenta (input_boolean.pi30_ricarica_batteria
  off) o batteria PI30 alla soglia di sottotensione: SCARICA. 2) In CARICA o
  PIENA ma non in Line mode da 5 minuti: la PI30 non usa la rete, notifica
  (con la tensione di rete letta dalla PI30) e corrente a 2A. 3) In CARICA
  sopra 2A con la batteria GoodWe che eroga più di 250W: corrente subito allo
  step che annulla quell'energia. 4) Un sensore GoodWe non disponibile da meno
  di 10 minuti: nessuna decisione. 5) In CARICA a 2A con prelievo >= 500W o
  GoodWe >= 200W per 60 s: SCARICA. 6) Passata a SCARICA da meno di 10
  minuti: resta. 7) SOC calcolato >= 95%: PIENA se c'è surplus; da PIENA si
  esce in SCARICA con prelievo >= 500W o GoodWe >= 200W per 60 s. 8) Fuori
  dalla CARICA senza surplus visibile (immissione che copre i carichi della
  PI30 più 60W, oppure al limite di immissione meno 50W, 250W): SCARICA.
  9) Altrimenti CARICA: si entra a 2A; uno step in su (2-10-20-30-40-50-60)
  solo con immissione visibile, batteria GoodWe ferma e corrente ferma da 20
  s; uno step in giù con prelievo >= 300W o GoodWe >= 200W; in mezzo la
  corrente resta e non viene riscritta. Con la GoodWe sotto il 100% (e non
  ferma al 99%), sopra 2A la corrente può solo scendere: la GoodWe ha la
  precedenza.
  AIUTANTI. input_number.pi30_bulk_carica e input_number.pi30_float_carica:
  bulk e float di carica (senza: 29.0V e 27.0V). input_number.pi30_keep_battery_live:
  tensione minima di SCARICA e MANTENIMENTO (senza: 25.5V; almeno 24.0V e
  sotto la tensione di redischarge dell'inverter). input_number.pi30_max_manual_current:
  step massimo (senza: 40A). input_number.pi30_charging_max_temperature,
  facoltativo: sopra questa temperatura del dissipatore la corrente scende di
  uno step ogni 2 minuti fino a 2A, con 5°C di isteresi.
triggers:
  - trigger: homeassistant
    id: avvio
    event: start
  - trigger: time_pattern
    id: controllo_10_minuti
    minutes: /10
  - trigger: numeric_state
    id: goodwe_in_scarica
    entity_id: sensor.goodwe_battery_power
    above: 250
  - trigger: state
    id: batteria_stabile
    entity_id:
      - sensor.goodwe_battery_state_of_charge
      - sensor.goodwe_battery_voltage
      - sensor.potenza_contatore
      - sensor.goodwe_battery_power
    for:
      seconds: 10
  - trigger: template
    id: sotto_tensione
    value_template: >-
      {{ states('sensor.heltec_pi30_battery_voltage') | float(99) <=
      states('sensor.heltec_pi30_display_pi30_battery_under_voltage') |
      float(24.0) }}
    for:
      minutes: 1
  - trigger: template
    id: temperatura_alta
    value_template: >-
      {{ states('sensor.heltec_pi30_heat_sink_temperature') | float(0) >=
      states('input_number.pi30_charging_max_temperature') | float(999) }}
  - trigger: state
    id: ricarica_batteria
    entity_id: input_boolean.pi30_ricarica_batteria
  - trigger: state
    id: aiutanti
    entity_id:
      - input_number.pi30_max_manual_current
      - input_number.pi30_keep_battery_live
      - input_number.pi30_bulk_carica
      - input_number.pi30_float_carica
actions:
  - variables:
      charging_steps: [2, 10, 20, 30, 40, 50, 60]
      max_manual_current: >-
        {{ [states('input_number.pi30_max_manual_current') | int(40), 2] | max }}
      soc: "{{ states('sensor.goodwe_battery_state_of_charge') | float(default=none) }}"
      voltage: "{{ states('sensor.goodwe_battery_voltage') | float(default=none) }}"
      grid_power: "{{ states('sensor.potenza_contatore') | float(default=none) }}"
      battery_power: "{{ states('sensor.goodwe_battery_power') | float(default=none) }}"
      current_utility: >-
        {{ states('sensor.heltec_pi30_display_pi30_max_utility_charging_current') | int(default=0) }}
      soc_known: "{{ soc is not none }}"
      volt_known: "{{ voltage is not none }}"
      power_known: "{{ grid_power is not none and battery_power is not none }}"
      sensors_unknown: "{{ soc is none or voltage is none }}"
      pi30_voltage: "{{ states('sensor.heltec_pi30_battery_voltage') | float(default=none) }}"
      under_voltage: >-
        {{ states('sensor.heltec_pi30_display_pi30_battery_under_voltage') | float(default=24.0) }}
      at_threshold: "{{ pi30_voltage is not none and pi30_voltage <= under_voltage }}"
      ricarica_on: "{{ not is_state('input_boolean.pi30_ricarica_batteria', 'off') }}"
      # Modalità attuale, dalle due priorità dell'inverter
      output_prio: "{{ states('sensor.heltec_pi30_display_pi30_output_source_priority') | float(9) }}"
      charger_prio: "{{ states('sensor.heltec_pi30_display_pi30_charger_source_priority') | float(9) }}"
      in_charge: "{{ output_prio == 0.0 and charger_prio == 2.0 }}"
      in_full: "{{ output_prio == 0.0 and charger_prio == 3.0 }}"
      in_discharge: "{{ output_prio == 2.0 }}"
      prio_age_s: >-
        {% set o = states.sensor.heltec_pi30_display_pi30_output_source_priority %}
        {% set c = states.sensor.heltec_pi30_display_pi30_charger_source_priority %}
        {{ ([(now() - o.last_changed).total_seconds(), (now() - c.last_changed).total_seconds()] | min)
           if o is not none and c is not none else 999999 }}
      charge_dwell_s: 600
      pi30_soc: >-
        {{ states('sensor.heltec_pi30_display_pi30_battery_soc_calculated') | float(default=none) }}
      full_resume_soc: 95
      pi30_full: "{{ pi30_soc is not none and pi30_soc >= full_resume_soc }}"
      pi30_load_w: "{{ states('sensor.heltec_pi30_output_active_power') | float(0) }}"
      # Surplus visibile: l'immissione è limitata a export_cap_w, oltre la
      # GoodWe taglia il fotovoltaico e il surplus vero non si vede.
      export_cap_w: 300
      export_margin_w: 50
      entry_charge_w: 60
      surplus_ok: >-
        {{ power_known and battery_power < 200 and
           (0 - grid_power) >= ([export_cap_w - export_margin_w, pi30_load_w + entry_charge_w] | min) }}
      discharge_confirm_s: 60
      goodwe_drain_w: 250
      step_up_wait_s: 20
      # GoodWe piena: 100%, oppure 99% con la batteria GoodWe ferma (il suo
      # BMS può fermare la carica a 99 e restarci per ore)
      goodwe_idle_w: 100
      goodwe_full: >-
        {{ soc_known and (soc > 99 or (soc >= 99 and power_known and
           battery_power | abs < goodwe_idle_w)) }}
      current_age_s: >-
        {% set ch = states.sensor.heltec_pi30_display_pi30_max_utility_charging_current %}
        {{ (now() - ch.last_changed).total_seconds() if ch is not none else 999999 }}
      goodwe_glitch_s: 600
      goodwe_glitch: >-
        {% set bad = expand(['sensor.goodwe_battery_state_of_charge', 'sensor.goodwe_battery_voltage',
                             'sensor.potenza_contatore', 'sensor.goodwe_battery_power'])
           | selectattr('state', 'in', ['unavailable', 'unknown']) | list %}
        {% set ns = namespace(g=false) %}
        {% for st in bad %}
          {% if (now() - st.last_changed).total_seconds() < goodwe_glitch_s %}
            {% set ns.g = true %}
          {% endif %}
        {% endfor %}
        {{ ns.g }}
      # LIMITE DI TEMPERATURA: corrente da rete massima. Dissipatore >=
      # charging_max_temp: uno step in meno ogni thermal_step_s (minimo 2A);
      # tra charging_max_temp - charging_temp_hysteresis e charging_max_temp:
      # niente step in su; sotto: max_manual_current.
      charging_temp_hysteresis: 5
      thermal_step_s: 120
      charging_max_temp: >-
        {{ states('input_number.pi30_charging_max_temperature') | float(default=none) }}
      heat_sink_temp: >-
        {{ states('sensor.heltec_pi30_heat_sink_temperature') | float(default=none) }}
      current_cap: >-
        {% set lower = charging_steps | select('lt', current_utility) | list %}
        {% if heat_sink_temp is none or charging_max_temp is none %}
          {% set cap = max_manual_current %}
        {% elif heat_sink_temp >= charging_max_temp and current_age_s >= thermal_step_s %}
          {% set cap = (lower | max) if lower | length > 0 else charging_steps | min %}
        {% elif heat_sink_temp > charging_max_temp - charging_temp_hysteresis %}
          {% set cap = [current_utility, max_manual_current] | min %}
        {% else %}
          {% set cap = max_manual_current %}
        {% endif %}
        {{ [cap, charging_steps | min] | max }}
      # MODULAZIONE: uno step in su solo con surplus visibile, GoodWe ferma e
      # corrente ferma da step_up_wait_s; uno step in giù con prelievo >= 300W
      # o GoodWe >= 200W (o potenze sconosciute); in mezzo resta dov'è.
      charger_v: >-
        {{ pi30_voltage if pi30_voltage is not none and pi30_voltage > 20 else 26.4 }}
      next_step: >-
        {% set up = charging_steps | select('gt', current_utility) | select('le', current_cap) | list %}
        {{ (up | min) if up | length > 0 else current_utility }}
      step_up_ok: >-
        {{ power_known and next_step > current_utility and
           current_age_s >= step_up_wait_s and battery_power < goodwe_idle_w and
           (0 - grid_power) >= ([export_cap_w - export_margin_w,
                                 (next_step - current_utility) * charger_v] | min) }}
      step_down_needed: >-
        {{ not power_known or grid_power >= 300 or battery_power >= 200 }}
      modulated_current: >-
        {% set allowed = charging_steps | select('le', current_cap) | list %}
        {% set down = charging_steps | select('lt', current_utility) | list %}
        {% if current_utility > current_cap %}
          {{ (allowed | max) if allowed | length > 0 else charging_steps | min }}
        {% elif step_up_ok %}
          {{ next_step }}
        {% elif step_down_needed %}
          {{ (down | max) if down | length > 0 else charging_steps | min }}
        {% else %}
          {{ current_utility }}
        {% endif %}
      # Quando la modulazione può anche salire: GoodWe piena (o >= 55V, o al
      # 100% sotto 53V), oppure CARICA a 2A senza prelievo né scarica GoodWe.
      # Altrimenti (GoodWe sotto il 100%) si può solo scendere.
      modulation_allowed: >-
        {{ goodwe_full or (volt_known and voltage >= 55) or
           (soc_known and volt_known and soc > 99 and voltage < 53) or
           (power_known and current_utility == 2 and grid_power < 500 and battery_power < 200) }}
      # CARICA DALLA GOODWE: lo step più alto che annulla l'energia presa dalla
      # batteria GoodWe e dalla rete, lasciandone al massimo goodwe_idle_w;
      # almeno uno step sotto quello attuale, minimo 2A.
      drain_w: >-
        {{ ([battery_power, 0] | max if battery_power is not none else 0)
           + ([grid_power, 0] | max if grid_power is not none else 0) }}
      drain_current: >-
        {% set target = current_utility - (drain_w - goodwe_idle_w) / charger_v %}
        {% set fit = charging_steps | select('le', target) | select('lt', current_utility) | list %}
        {{ (fit | max) if fit | length > 0 else charging_steps | min }}
      # PI30 FUORI RETE: in CARICA o PIENA (uscita "rete prima") la PI30 deve
      # stare in Line mode; da line_lost_s in un altro modo non usa la rete.
      line_lost_s: 300
      pi30_device_mode: "{{ states('sensor.heltec_pi30_display_pi30_device_mode') }}"
      device_mode_age_s: >-
        {% set m = states.sensor.heltec_pi30_display_pi30_device_mode %}
        {{ (now() - m.last_changed).total_seconds() if m is not none else 0 }}
      line_lost: >-
        {{ (in_charge or in_full) and
           pi30_device_mode not in ['Line mode', 'unknown', 'unavailable'] and
           device_mode_age_s >= line_lost_s and prio_age_s >= line_lost_s }}
  # 1) SCARICA FORZATA: ricarica spenta, o batteria PI30 alla soglia di
  # sottotensione (da qualunque modalità: con bulk e float alla tensione
  # minima il caricabatterie la riporta su).
  - if:
      - condition: template
        value_template: "{{ not ricarica_on or at_threshold }}"
    then:
      - action: script.turn_on
        target:
          entity_id: script.pi30_batteria_da_scaricare
        data:
          variables:
            current_limit: "{{ current_cap }}"
      - wait_template: "{{ is_state('script.pi30_batteria_da_scaricare', 'off') }}"
        timeout: 120
      - stop: Ricarica spenta o batteria alla soglia di sottotensione, scarica
  # 2) PI30 FUORI RETE: avviso, corrente da rete a 2A (al ritorno della rete
  # la carica riparte dal minimo), nessuna modulazione.
  - if:
      - condition: template
        value_template: "{{ line_lost }}"
    then:
      - action: persistent_notification.create
        data:
          notification_id: pi30_fuori_rete
          title: PI30 non sta usando la rete
          message: >-
            La PI30 è in {{ 'CARICA' if in_charge else 'PIENA' }} (uscita "rete
            prima") ma è in {{ pi30_device_mode }} da
            {{ (device_mode_age_s / 60) | round(0) | int }} minuti: la batteria
            alimenta i carichi invece di caricarsi.
            {%- set gv = states('sensor.heltec_pi30_pi30_grid_voltage') %}
            {%- if is_number(gv) %} Tensione di rete letta dalla PI30: {{ gv | float | round(0) | int }}V.{% endif %}
            Controlla l'ingresso AC della PI30 (interruttore o presa) e il
            display dell'inverter.
      - if:
          - condition: template
            value_template: "{{ in_charge and current_utility != 2 }}"
        then:
          - action: select.select_option
            target:
              entity_id: select.heltec_pi30_display_pi30_set_max_utility_charging_current
            data:
              option: "2"
      - stop: PI30 in CARICA o PIENA ma non sulla rete, nessuna modulazione
  # In Line mode: togli l'avviso, entro 15 minuti dal ritorno sulla rete o
  # dall'ultimo cambio di modalità
  - if:
      - condition: template
        value_template: >-
          {{ pi30_device_mode == 'Line mode' and [device_mode_age_s, prio_age_s] | min < 900 }}
    then:
      - action: persistent_notification.dismiss
        data:
          notification_id: pi30_fuori_rete
  # 3) CARICA DALLA GOODWE: in CARICA sopra 2A con la batteria GoodWe che
  # eroga più di goodwe_drain_w, corrente subito a drain_current.
  - if:
      - condition: template
        value_template: >-
          {{ in_charge and current_utility > 2 and power_known and battery_power > goodwe_drain_w }}
    then:
      - action: select.select_option
        target:
          entity_id: select.heltec_pi30_display_pi30_set_max_utility_charging_current
        data:
          option: "{{ drain_current | string }}"
      - delay: "00:00:10"
      - stop: GoodWe in scarica durante la CARICA, corrente da rete ridotta
  # 4) GLITCH GOODWE: un sensore GoodWe non disponibile da poco non decide nulla
  - if:
      - condition: template
        value_template: "{{ goodwe_glitch }}"
    then:
      - stop: Sensore GoodWe non disponibile da poco, nessuna decisione
  # 5) CARICA AL MINIMO MA NON BASTA ("VUOL DIRE CHE"): in CARICA a 2A con
  # prelievo >= 500W o GoodWe >= 200W per discharge_confirm_s: SCARICA. Sotto
  # i 60 s è il trasferimento dei carichi, un transitorio.
  - if:
      - condition: template
        value_template: >-
          {{ in_charge and current_utility == 2 and power_known and
             not (grid_power < 500 and battery_power < 200) }}
    then:
      - wait_template: >-
          {{ states('sensor.potenza_contatore') | float(999) < 500 and
             states('sensor.goodwe_battery_power') | float(999) < 200 }}
        timeout: "{{ discharge_confirm_s }}"
        continue_on_timeout: true
      - if:
          - condition: template
            value_template: "{{ wait.completed }}"
        then:
          - stop: Prelievo o scarica GoodWe durati meno di 60 s, nessun cambio
      - action: script.turn_on
        target:
          entity_id: script.pi30_batteria_da_scaricare
        data:
          variables:
            current_limit: "{{ current_cap }}"
      - wait_template: "{{ is_state('script.pi30_batteria_da_scaricare', 'off') }}"
        timeout: 120
      - stop: Carica al minimo ma GoodWe in scarica o prelievo dalla rete, scarica
  # 6) ANTI-OSCILLAZIONE: passata a SCARICA da meno di charge_dwell_s, resta
  # (lo script tiene aggiornata la tensione minima)
  - if:
      - condition: template
        value_template: "{{ in_discharge and prio_age_s < charge_dwell_s }}"
    then:
      - action: script.turn_on
        target:
          entity_id: script.pi30_batteria_da_scaricare
        data:
          variables:
            current_limit: "{{ current_cap }}"
      - wait_template: "{{ is_state('script.pi30_batteria_da_scaricare', 'off') }}"
        timeout: 120
      - stop: In scarica da meno di 10 minuti, nessun ritorno in carica
  # 7) BATTERIA PIENA (SOC calcolato >= full_resume_soc). In PIENA si resta
  # finché il contatore non preleva >= 500W o la GoodWe non eroga >= 200W per
  # 60 s, poi SCARICA. Fuori dalla CARICA: PIENA se c'è surplus, altrimenti
  # SCARICA. In CARICA (float): logica normale.
  - if:
      - condition: template
        value_template: "{{ pi30_full and in_full }}"
    then:
      - if:
          - condition: template
            value_template: "{{ power_known and not (grid_power < 500 and battery_power < 200) }}"
        then:
          - wait_template: >-
              {{ states('sensor.potenza_contatore') | float(999) < 500 and
                 states('sensor.goodwe_battery_power') | float(999) < 200 }}
            timeout: "{{ discharge_confirm_s }}"
            continue_on_timeout: true
          - if:
              - condition: template
                value_template: "{{ wait.completed }}"
            then:
              - stop: Batteria piena sui carichi del surplus, transitorio, nessun cambio
          - action: script.turn_on
            target:
              entity_id: script.pi30_batteria_da_scaricare
            data:
              variables:
                current_limit: "{{ current_cap }}"
          - wait_template: "{{ is_state('script.pi30_batteria_da_scaricare', 'off') }}"
            timeout: 120
          - stop: Batteria piena, surplus finito, scarica
      - stop: Batteria piena sui carichi del surplus, nessun cambio
  - if:
      - condition: template
        value_template: "{{ pi30_full and not in_charge }}"
    then:
      - if:
          - condition: template
            value_template: "{{ surplus_ok }}"
        then:
          - action: script.turn_on
            target:
              entity_id: script.pi30_batteria_piena
          - wait_template: "{{ is_state('script.pi30_batteria_piena', 'off') }}"
            timeout: 120
          - stop: Batteria piena e surplus, carichi sulla rete senza ricarica
      - action: script.turn_on
        target:
          entity_id: script.pi30_batteria_da_scaricare
        data:
          variables:
            current_limit: "{{ current_cap }}"
      - wait_template: "{{ is_state('script.pi30_batteria_da_scaricare', 'off') }}"
        timeout: 120
      - stop: Batteria piena e niente surplus, scarica
  # 8) SURPLUS VISIBILE: fuori dalla CARICA si entra solo se c'è surplus;
  # altrimenti SCARICA. Con le potenze sconosciute si va in CARICA a 2A
  # ("rete di sicurezza", qui sotto).
  - if:
      - condition: template
        value_template: "{{ not in_charge and power_known and not surplus_ok }}"
    then:
      - action: script.turn_on
        target:
          entity_id: script.pi30_batteria_da_scaricare
        data:
          variables:
            current_limit: "{{ current_cap }}"
      - wait_template: "{{ is_state('script.pi30_batteria_da_scaricare', 'off') }}"
        timeout: 120
      - stop: Surplus visibile insufficiente, scarica
  # 9) CARICA. Lo script rimette bulk e float di carica e, entrando, porta la
  # corrente da rete a 2A: la modulazione parte dall'esecuzione successiva.
  - action: script.turn_on
    target:
      entity_id: script.pi30_batteria_da_caricare
  - wait_template: "{{ is_state('script.pi30_batteria_da_caricare', 'off') }}"
    timeout: 120
  - if:
      - condition: template
        value_template: "{{ not in_charge }}"
    then:
      - stop: Entrata in CARICA, corrente da rete al minimo
  - if:
      - condition: template
        value_template: "{{ modulation_allowed }}"
    then:
      - if:
          - condition: template
            value_template: "{{ modulated_current | int != current_utility }}"
        then:
          - action: select.select_option
            target:
              entity_id: select.heltec_pi30_display_pi30_set_max_utility_charging_current
            data:
              option: "{{ modulated_current | string }}"
          - delay: "00:00:10"
    else:
      # GoodWe sotto il 100%: si resta in carica e si scende di uno step solo
      # se qualcosa preleva troppo. Con SOC o tensione GoodWe sconosciuti, o
      # con le potenze sconosciute, 2A.
      - if:
          - condition: template
            value_template: >-
              {{ not power_known or (sensors_unknown and grid_power < 300 and battery_power < 200) }}
        then:
          - if:
              - condition: template
                value_template: "{{ current_utility != 2 }}"
            then:
              - action: select.select_option
                target:
                  entity_id: select.heltec_pi30_display_pi30_set_max_utility_charging_current
                data:
                  option: "2"
        else:
          - if:
              - condition: template
                value_template: "{{ (grid_power >= 300 or battery_power >= 200) and current_utility > 2 }}"
            then:
              - action: select.select_option
                target:
                  entity_id: select.heltec_pi30_display_pi30_set_max_utility_charging_current
                data:
                  option: >-
                    {{ (charging_steps | select('lt', current_utility) | list | max) | string }}
              - delay: "00:00:10"
mode: queued
max: 5
max_exceeded: silent
