          entity_id:
            - binary_sensor.sensore_porta_contact
      - type: entities
        entities:
          - entity: switch.tripla_1
            icon: mdi:numeric-1-box
            name: Tripla 1
            secondary_info: none
          - entity: switch.tripla_2
            name: Tripla 2
            icon: mdi:numeric-2-box
          - entity: switch.tripla_3
            name: Tripla 3
            icon: mdi:numeric-3-box
