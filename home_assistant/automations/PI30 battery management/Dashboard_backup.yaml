        state_color: true
        show_header_toggle: false
      - show_name: true
        show_icon: true
        show_state: true
        type: glance
        entities:
          - entity: switch.irrigatore
          - entity: sensor.pulsante_battery
          - entity: switch.s905x3
        title: Altro
        state_color: true
      - type: entities
        entities:
          - entity: binary_sensor.sensore_porta_contact
            name: Porta di ingresso
            secondary_info: last-updated
          - entity: sensor.sensore_porta_battery
            name: Batteria
            secondary_info: last-updated
          - entity: binary_sensor.presenza_garage
          - entity: binary_sensor.presenza_terrazzo
          - entity: sensor.luminosita_terrazzo
