        title: Prese
        show_header_toggle: false
    visible:
      - user: f0e6ae5b825d422898b6b950b6b2e43a
      - user: d4d1f35aef604ed39ac1de70ed507db0
  - theme: Backend-selected
    title: Fotovoltaico
    path: fotovoltaico
    icon: mdi:solar-power-variant
    badges: []
    cards:
      - type: custom:apexcharts-card
        graph_span: 12h
        update_interval: 30s
        header:
          show: false
        yaxis:
          - min: 0
            max: 100
            decimals: 0
            apex_config:
              tickAmount: 5
              labels:
                offsetX: -27
                formatter: |
                  EVAL:function(value) {
                    return Math.round(value) + '%';
                  }
        apex_config:
          legend:
            show: false
          chart:
            height: 200
          grid:
            padding:
              top: -18
              right: 15
              bottom: -18
              left: 0
        series:
          - entity: sensor.goodwe_fotovoltaico_potenza_percentuale
            name: GoodWe
            type: area
            opacity: 0.9
            stroke_width: 2
          - entity: sensor.fotovoltaico_potenza_percentuale
            name: Fotovoltaico
            type: area
            opacity: 0.4
            stroke_width: 2
      - type: history-graph
        entities:
          - entity: sensor.goodwe_house_consumption
            name: Consumo
          - entity: sensor.goodwe_back_up_l1_power
            name: Backup
          - entity: sensor.goodwe_active_power
            name: Contatore
          - entity: sensor.goodwe_battery_power
          - entity: sensor.goodwe_fotovoltaico_potenza
        title: Potenza
        hours_to_show: 24
        show_names: true
      - type: history-graph
        entities:
          - sun.sun
        hours_to_show: 24
      - square: false
        type: grid
        cards:
          - type: custom:modern-circular-gauge
            unit: W
            name: Fotovoltaico Totale
            header_position: top
