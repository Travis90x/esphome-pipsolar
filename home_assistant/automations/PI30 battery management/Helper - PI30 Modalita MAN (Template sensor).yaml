# Facoltativo. La modalità in cui l'automazione MAN tiene la PI30, letta
# dalle due priorità dell'inverter: un valore fisso finché la modalità non
# cambia, da mettere in dashboard e nello storico al posto degli script.
# Lo stato on/off di script.pi30_batteria_da_caricare (e degli altri) dice
# solo che lo script sta girando, per pochi secondi a ogni esecuzione
# dell'automazione, non che la PI30 sia in carica.
#
#   CARICA    uscita "rete prima", carica "solare + rete"
#   PIENA     uscita "rete prima", carica "solo solare"
#   SCARICA   uscita SBU, carica "solo solare"
#   MANTIENI  uscita SBU, carica "solare + rete" (KEEP LIVE con
#             input_boolean.pi30_ricarica_batteria spento)
#   ALTRO     qualunque altra combinazione
#
# CARICA e PIENA diventano "... - NON SULLA RETE" quando la PI30 non è in
# Line mode: con l'uscita "rete prima" vuol dire che non sta usando la rete
# (23/10/2026 dalle 14:49, oltre due ore in Battery mode in CARICA). Le
# uscite di 10 secondi si vedono come una tacca nello storico; l'avviso
# dell'automazione arriva dopo 5 minuti.
#
# Da interfaccia (niente configuration.yaml):
#   Impostazioni > Dispositivi e servizi > Aiutanti > Crea aiutante >
#   Template > Sensore
#   Nome: PI30 Modalità MAN   (diventa sensor.pi30_modalita_man)
#   Unità di misura, classe del dispositivo, classe di stato: vuote
#   Modello di stato: il template sotto, dopo "state: >-"
#
# Oppure, in configuration.yaml (poi riavvia):
template:
  - sensor:
      - name: PI30 Modalità MAN
        unique_id: pi30_modalita_man
        icon: mdi:battery-sync
        state: >-
          {% set o = states('sensor.heltec_pi30_display_pi30_output_source_priority') | float(-1) %}
          {% set c = states('sensor.heltec_pi30_display_pi30_charger_source_priority') | float(-1) %}
          {% set m = states('sensor.heltec_pi30_display_pi30_device_mode') %}
          {% if o == 0 and c == 2 %}{% set mode = 'CARICA' %}
          {% elif o == 0 and c == 3 %}{% set mode = 'PIENA' %}
          {% elif o == 2 and c == 3 %}{% set mode = 'SCARICA' %}
          {% elif o == 2 and c == 2 %}{% set mode = 'KEEP LIVE' if is_state('input_boolean.pi30_ricarica_batteria', 'off') else 'MANTIENI' %}
          {% else %}{% set mode = 'ALTRO' %}{% endif %}
          {{ mode ~ (' - NON SULLA RETE' if mode in ['CARICA', 'PIENA'] and m not in ['Line mode', 'unknown', 'unavailable'] else '') }}
        availability: >-
          {{ has_value('sensor.heltec_pi30_display_pi30_output_source_priority')
             and has_value('sensor.heltec_pi30_display_pi30_charger_source_priority') }}
