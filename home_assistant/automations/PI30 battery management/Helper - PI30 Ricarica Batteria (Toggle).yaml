# Interruttore "PI30 Ricarica Batteria" per
# "Automation - PI30 Battery Charging Intelligent Modulation.yaml".
#
# Acceso (o helper assente): la batteria si ricarica, l'automazione fa tutto
# come sempre (MANTIENI alla soglia, poi CARICA / SCARICA secondo la logica
# GoodWe).
# Spento: nessuna carica oltre i 24V. L'automazione esegue SEMPRE SCARICA,
# che mette SBU, carica "solare + rete" e bulk/float a 24.0V: la batteria
# alimenta i carichi e, quando l'inverter passa alla rete, il caricabatterie
# la tiene a 24.0V, così il BMS non stacca e l'inverter non si spegne.
# Non disattivare l'automazione al posto di questo interruttore: disattivata
# non protegge la batteria.
#
# Dalla UI (senza configuration.yaml):
#   Impostazioni > Dispositivi e servizi > Aiutanti > Crea aiutante > Interruttore
#   Nome: PI30 Ricarica Batteria
#   (genera input_boolean.pi30_ricarica_batteria; controlla l'ID entità
#    dopo il salvataggio)
#
# Oppure, equivalente, in configuration.yaml (poi riavvia):
input_boolean:
  pi30_ricarica_batteria:
    name: PI30 Ricarica Batteria
    icon: mdi:battery-charging
