alias: PI30 batteria da caricare
description: >-
  CARICA. Priorità di uscita "rete prima" (Utility) e carica "solare +
  rete". La corrente da rete la modula l'automazione MAN.
  L'automazione MAN lo chiama a ogni esecuzione e aspetta che finisca:
  senza niente da scrivere finisce subito, le attese ci sono solo
  attorno alle scritture. Lo stato on/off dello script dice solo che sta
  girando, non la modalità (vedi l'aiutante PI30 Modalita MAN).
sequence:
  - if:
      - condition: template
        value_template: |-
          {{ not (
            states('sensor.heltec_pi30_display_pi30_output_source_priority') | float(0) == 0.0
            and
            states('sensor.heltec_pi30_display_pi30_charger_source_priority') | float(0) == 2.0
          ) }}
    then:
      - delay:
          hours: 0
          minutes: 0
          seconds: 2
          milliseconds: 0
      - action: button.press
        target:
          entity_id: button.heltec_pi30_display_pi30_charger_solar_utility
        data: {}
      - delay:
          hours: 0
          minutes: 0
          seconds: 1
          milliseconds: 0
      - action: switch.turn_on
        target:
          entity_id: switch.heltec_pi30_display_pi30_output_priority_utility
      - delay:
          hours: 0
          minutes: 0
          seconds: 2
          milliseconds: 0
mode: queued
max: 10
