alias: PI30 batteria da caricare
description: >-
  IN CARICA. Uscita "rete prima", carica "solare + rete", bulk e float di
  carica dagli aiutanti "PI30 bulk carica" e "PI30 float carica" (senza:
  29.0V e 27.0V), corrente totale 60A. Entrando in CARICA da un'altra
  modalità la corrente da rete parte da 2A; poi la regola l'automazione PI30
  Batteria MAN, che chiama questo script a ogni esecuzione e aspetta che
  finisca. Scrive solo quello che è diverso: senza niente da scrivere finisce
  subito. Bulk e float: salendo prima il bulk, scendendo prima il float, così
  il float non supera mai il bulk.
sequence:
  - variables:
      bulk_target: "{{ states('input_number.pi30_bulk_carica') | float(29.0) | round(1) }}"
      float_target: >-
        {{ [states('input_number.pi30_float_carica') | float(27.0) | round(1), bulk_target] | min }}
      bulk_now: "{{ states('sensor.pi30_battery_bulk_voltage') | float(0) | round(1) }}"
      entering: >-
        {{ not (states('sensor.pi30_output_source_priority') | float(9) == 0.0
           and states('sensor.pi30_charger_source_priority') | float(9) == 2.0) }}
  # Entrando in CARICA: corrente da rete al minimo
  - if:
      - condition: template
        value_template: >-
          {{ entering and
             states('sensor.pi30_max_utility_charging_current') | int(0) != 2 }}
    then:
      - action: select.select_option
        target:
          entity_id: select.pi30_set_max_utility_charging_current
        data:
          option: "2"
      - delay: "00:00:02"
  # Bulk e float di carica
  - if:
      - condition: template
        value_template: "{{ bulk_target >= bulk_now }}"
    then:
      - if:
          - condition: template
            value_template: "{{ bulk_target != bulk_now }}"
        then:
          - action: number.set_value
            target:
              entity_id: number.pi30_set_battery_bulk_voltage
            data:
              value: "{{ bulk_target }}"
          - delay: "00:00:02"
      - if:
          - condition: template
            value_template: >-
              {{ states('sensor.pi30_battery_float_voltage') | float(0) | round(1) != float_target }}
        then:
          - action: number.set_value
            target:
              entity_id: number.pi30_set_battery_float_voltage
            data:
              value: "{{ float_target }}"
          - delay: "00:00:02"
    else:
      - if:
          - condition: template
            value_template: >-
              {{ states('sensor.pi30_battery_float_voltage') | float(0) | round(1) != float_target }}
        then:
          - action: number.set_value
            target:
              entity_id: number.pi30_set_battery_float_voltage
            data:
              value: "{{ float_target }}"
          - delay: "00:00:02"
      - action: number.set_value
        target:
          entity_id: number.pi30_set_battery_bulk_voltage
        data:
          value: "{{ bulk_target }}"
      - delay: "00:00:02"
  # Corrente totale di carica (rete + solare) al massimo: la limita la
  # corrente da rete
  - if:
      - condition: template
        value_template: >-
          {{ states('sensor.pi30_max_total_charging_current') | int(0) < 60 }}
    then:
      - action: select.select_option
        target:
          entity_id: select.pi30_set_max_total_charging_current
        data:
          option: "60"
      - delay: "00:00:02"
  # Priorità
  - if:
      - condition: template
        value_template: "{{ entering }}"
    then:
      - action: button.press
        target:
          entity_id: button.pi30_charger_solar_utility
      - delay: "00:00:01"
      - action: switch.turn_on
        target:
          entity_id: switch.pi30_output_priority_utility
      - delay: "00:00:02"
mode: queued
max: 10
