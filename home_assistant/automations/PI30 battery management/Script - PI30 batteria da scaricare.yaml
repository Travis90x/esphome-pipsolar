alias: PI30 batteria da scaricare
description: >-
  IN SCARICA e MANTENIMENTO. Carica "solare + rete", bulk e float alla
  tensione minima (aiutante "PI30 batteria tensione di mantenimento", senza:
  25.5V; mai sotto 24.0V), corrente da rete 10A (meno con current_limit, il
  limite di temperatura dell'automazione PI30 Batteria MAN). Scrive anche la
  tensione di recharge dell'inverter alla tensione minima (a passi di 0.5V,
  per difetto, tra 22.0V e 25.5V): IN SCARICA uscita SBU, la batteria
  alimenta i carichi finché scende lì, poi la PI30 passa i carichi sulla
  rete. MANTENIMENTO (keep_on_grid, lo decide l'automazione): uscita "rete
  prima", i carichi restano sulla rete e il caricabatterie tiene la batteria
  alla tensione minima, coprendo solo l'autoconsumo dell'inverter (circa
  50W) e la scarica interna: non la ricarica oltre e non la lascia scendere
  fino allo stacco del BMS. In SBU la PI30 tornava a batteria ogni 10
  minuti. La tensione minima deve restare sotto la tensione di redischarge
  dell'inverter, altrimenti in SBU la PI30 torna a scaricare e la rete la
  ricarica a ogni ciclo. Scrive solo quello che è diverso: senza niente da
  scrivere finisce subito. Prima bulk, float e recharge, poi le priorità,
  così il caricabatterie non carica mai oltre la tensione minima.
sequence:
  - variables:
      hold: >-
        {{ [states('input_number.pi30_keep_battery_live') | float(25.5), 24.0] | max | round(1) }}
      hold_current: >-
        {{ ([10, current_limit | int(10)] | min) if current_limit is defined else 10 }}
      bulk_now: "{{ states('sensor.pi30_battery_bulk_voltage') | float(0) | round(1) }}"
      on_grid: "{{ (keep_on_grid | bool) if keep_on_grid is defined else false }}"
  # Recharge in un secondo blocco perché legge hold: così non conta l'ordine
  # delle chiavi dentro un blocco. La PI30 accetta 22.0-25.5V a passi di 0.5V
  - variables:
      recharge_target: >-
        {{ ([[((hold * 2) | round(0, 'floor')) / 2, 22.0] | max, 25.5] | min) | round(1) }}
  # Bulk e float alla tensione minima: scendendo prima il float, salendo
  # prima il bulk
  - if:
      - condition: template
        value_template: "{{ hold < bulk_now }}"
    then:
      - if:
          - condition: template
            value_template: >-
              {{ states('sensor.pi30_battery_float_voltage') | float(0) | round(1) != hold }}
        then:
          - action: number.set_value
            target:
              entity_id: number.pi30_set_battery_float_voltage
            data:
              value: "{{ hold }}"
          - delay: "00:00:02"
      - action: number.set_value
        target:
          entity_id: number.pi30_set_battery_bulk_voltage
        data:
          value: "{{ hold }}"
      - delay: "00:00:02"
    else:
      - if:
          - condition: template
            value_template: "{{ hold != bulk_now }}"
        then:
          - action: number.set_value
            target:
              entity_id: number.pi30_set_battery_bulk_voltage
            data:
              value: "{{ hold }}"
          - delay: "00:00:02"
      - if:
          - condition: template
            value_template: >-
              {{ states('sensor.pi30_battery_float_voltage') | float(0) | round(1) != hold }}
        then:
          - action: number.set_value
            target:
              entity_id: number.pi30_set_battery_float_voltage
            data:
              value: "{{ hold }}"
          - delay: "00:00:02"
  # Tensione di recharge alla tensione minima: in SBU la PI30 passa sulla
  # rete lì, invece che al valore impostato sull'inverter
  - if:
      - condition: template
        value_template: >-
          {{ states('sensor.pi30_battery_recharge_voltage') | float(0) | round(1) != recharge_target }}
    then:
      - action: number.set_value
        target:
          entity_id: number.pi30_set_battery_recharge_voltage
        data:
          value: "{{ recharge_target }}"
      - delay: "00:00:02"
  # Priorità: uscita SBU (SCARICA) o "rete prima" (MANTENIMENTO), carica
  # "solare + rete"
  - if:
      - condition: template
        value_template: >-
          {{ not (states('sensor.pi30_output_source_priority') | float(9) == (0.0 if on_grid else 2.0)
             and states('sensor.pi30_charger_source_priority') | float(9) == 2.0) }}
    then:
      - action: button.press
        target:
          entity_id: button.pi30_charger_solar_utility
      - delay: "00:00:01"
      - action: switch.turn_on
        target:
          entity_id: >-
            {{ 'switch.pi30_output_priority_utility' if on_grid
               else 'switch.pi30_output_priority_sbu' }}
      - delay: "00:00:02"
  # Corrente da rete per il mantenimento
  - if:
      - condition: template
        value_template: >-
          {{ states('sensor.pi30_max_utility_charging_current') | int(0) != hold_current }}
    then:
      - action: select.select_option
        target:
          entity_id: select.pi30_set_max_utility_charging_current
        data:
          option: "{{ hold_current | string }}"
      - delay: "00:00:02"
mode: queued
max: 10
