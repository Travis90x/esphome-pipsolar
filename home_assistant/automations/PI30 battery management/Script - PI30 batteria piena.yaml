alias: PI30 batteria piena
description: >-
  PIENA. Uscita "rete prima", carica "solo solare". Usato dall'automazione
  PI30 Batteria MAN quando il SOC calcolato della PI30 è almeno 95% e c'è
  surplus: i carichi della PI30 vanno sulla rete, cioè sul fotovoltaico che
  la GoodWe sta tagliando, e il caricabatterie resta spento, quindi nessuna
  nuova fase bulk a 29V su un pacco pieno (il 29/09/2026 cinque volte in 40
  minuti). La batteria perde solo l'autoconsumo dell'inverter; sotto il 95%
  l'automazione torna alla CARICA, senza surplus alla SCARICA. Scrive solo se
  le priorità sono diverse: altrimenti finisce subito.
sequence:
  - if:
      - condition: template
        value_template: >-
          {{ not (states('sensor.heltec_pi30_display_pi30_output_source_priority') | float(9) == 0.0
             and states('sensor.heltec_pi30_display_pi30_charger_source_priority') | float(9) == 3.0) }}
    then:
      - action: button.press
        target:
          entity_id: button.heltec_pi30_display_pi30_charger_solar_only
      - delay: "00:00:01"
      - action: switch.turn_on
        target:
          entity_id: switch.heltec_pi30_display_pi30_output_priority_utility
      - delay: "00:00:02"
mode: queued
max: 10
