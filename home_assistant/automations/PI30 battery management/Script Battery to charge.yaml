alias: PI30 batteria da caricare
description: >-
  CARICA. Riporta le tensioni di bulk e float ai valori normali di carica
  (normal_bulk_v e normal_float_v qui sotto: controllali e mettici i tuoi),
  abbassate a 24.0V dallo script SCARICA. Le scrive solo se diverse, prima
  il bulk e poi il float, così il float non supera mai il bulk. Poi
  priorità di uscita "rete prima" (Utility) e carica "solare + rete". La
  corrente da rete la modula l'automazione MAN.
sequence:
  - variables:
      normal_bulk_v: 29.0
      normal_float_v: 27.5
  - delay:
      hours: 0
      minutes: 0
      seconds: 2
      milliseconds: 0
  # In salita prima il bulk, poi il float
  - if:
      - condition: template
        value_template: >-
          {{ states('sensor.heltec_pi30_display_pi30_battery_bulk_voltage')
             | float(0) | round(1) != normal_bulk_v }}
    then:
      - action: number.set_value
        target:
          entity_id: number.heltec_pi30_display_pi30_set_battery_bulk_voltage
        data:
          value: "{{ normal_bulk_v }}"
      - delay:
          hours: 0
          minutes: 0
          seconds: 2
          milliseconds: 0
  - if:
      - condition: template
        value_template: >-
          {{ states('sensor.heltec_pi30_display_pi30_battery_float_voltage')
             | float(0) | round(1) != normal_float_v }}
    then:
      - action: number.set_value
        target:
          entity_id: number.heltec_pi30_display_pi30_set_battery_float_voltage
        data:
          value: "{{ normal_float_v }}"
      - delay:
          hours: 0
          minutes: 0
          seconds: 2
          milliseconds: 0
  - if:
      - condition: template
        value_template: |-
          {{ not (
            states('sensor.heltec_pi30_display_pi30_output_source_priority') | float(0) == 0.0
            and
            states('sensor.heltec_pi30_display_pi30_charger_source_priority') | float(0) == 2.0
          ) }}
    then:
      - action: button.press
        target:
          entity_id: button.heltec_pi30_display_pi30_charger_solar_utility
        data: {}
      - delay:
          hours: 0
          minutes: 0
          seconds: 1
          milliseconds: 0
      - action: switch.turn_on
        target:
          entity_id: switch.heltec_pi30_display_pi30_output_priority_utility
  - delay:
      hours: 0
      minutes: 0
      seconds: 2
      milliseconds: 0
mode: queued
max: 10
