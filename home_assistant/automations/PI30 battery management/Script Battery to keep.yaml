alias: PI30 batteria da mantenere
description: >-
  Mantenimento alla soglia di sottotensione. Fa esattamente quello che fa
  SCARICA (script.pi30_batteria_da_scaricare): SBU, carica "solare +
  rete", bulk e float a 24.0V, corrente da rete almeno 40A. A quella
  tensione l'inverter è in Line mode e il caricabatterie riporta la
  batteria a 24.0V e la tiene lì, coprendo l'autoconsumo dell'inverter
  (circa 50W) che altrimenti la porterebbe allo stacco del BMS (23/09,
  25/09 e 26/09/2026, sempre a 22.7-22.8V). L'automazione MAN lo usa al
  posto di CARICA quando la batteria è alla soglia, per esempio con una
  carica a 2A che non basta a coprire l'autoconsumo.
sequence:
  - action: script.pi30_batteria_da_scaricare
mode: queued
max: 10
