alias: PI30 batteria da mantenere
description: >-
  Mantenimento alla soglia di sottotensione: SBU, carica "solare + rete",
  corrente massima da rete 10A. A quella tensione l'inverter in SBU è già
  in Line mode (i carichi vanno sulla rete); i 10A riportano la batteria
  qualche decimo di volt sopra la soglia, poi l'automazione MAN torna a
  SCARICA e il ciclo si ripete, invece di scendere fino allo stacco del
  BMS. 2A NON bastano: il 26/09/2026 02:02-02:29 l'inverter segnava +2A
  mentre la batteria scendeva da 23.6V a 22.8V, e il BMS l'ha staccata
  (inverter spento). Con 9-10A, lo stesso giorno 02:30-03:58, è risalita
  da 23.2V a 25.9V. La corrente viene riportata a 10A anche quando le
  priorità sono già giuste, così un valore più alto lasciato da un'altra
  logica non diventa una ricarica piena dalla rete.
sequence:
  - delay:
      hours: 0
      minutes: 0
      seconds: 2
      milliseconds: 0
  - if:
      - condition: template
        value_template: |-
          {{ not (
            states('sensor.heltec_pi30_display_pi30_output_source_priority') | float(0) == 2.0
            and
            states('sensor.heltec_pi30_display_pi30_charger_source_priority') | float(0) == 2.0
          ) }}
    then:
      - action: button.press
        target:
          entity_id:
            - button.heltec_pi30_display_pi30_charger_solar_utility
        data: {}
      - delay:
          hours: 0
          minutes: 0
          seconds: 1
          milliseconds: 0
      - action: switch.turn_on
        target:
          entity_id: switch.heltec_pi30_display_pi30_output_priority_sbu
      - delay:
          hours: 0
          minutes: 0
          seconds: 1
          milliseconds: 0
  - if:
      - condition: template
        value_template: >-
          {{ states('sensor.heltec_pi30_display_pi30_max_utility_charging_current')
             | int(default=0) != 10 }}
    then:
      - action: select.select_option
        target:
          entity_id: select.heltec_pi30_display_pi30_set_max_utility_charging_current
        data:
          option: '10'
  - delay:
      hours: 0
      minutes: 0
      seconds: 2
      milliseconds: 0
mode: queued
max: 10
