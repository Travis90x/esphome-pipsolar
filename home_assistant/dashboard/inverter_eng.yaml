# Generic dashboard for the PI30 inverter with this repository's firmware
# (examples/esp32/heltec-pi30), without GoodWe: the inverter and its battery.
# It uses the scripts and helpers in "home_assistant/automations/PI30 battery
# management" (manual CHARGE and DISCHARGE/HOLD) and the automation in
# "home_assistant/automations/PI30 battery SOC". Rows whose entity you did not
# create show "Entity not found": delete them or create the entity.
# To import: Settings > Dashboards > Add dashboard > New dashboard from
# scratch, open it, pencil at the top right, three dots > Raw configuration
# editor, replace everything with this file and save. To add it as a view to
# a dashboard you already have, copy only the block under "views:".
title: PI30 inverter
views:
  - type: sections
    title: PI30 inverter
    path: inverter
    icon: mdi:solar-power-variant
    max_columns: 4
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Overview
          - type: gauge
            entity: sensor.pi30_battery_soc_calculated
            name: Battery SOC (energy counting)
            min: 0
            max: 100
            needle: true
            severity:
              red: 0
              yellow: 15
              green: 40
          - type: tile
            entity: sensor.pi30_device_mode
            name: Device mode
          - type: tile
            entity: sensor.pi30_battery_voltage
            name: Battery voltage
          - type: tile
            entity: sensor.pi30_battery_power
            name: Battery power
          - type: tile
            entity: sensor.pi30_pv_power
            name: Solar power
          - type: tile
            entity: sensor.pi30_output_active_power
            name: Output power
          - type: tile
            entity: sensor.pi30_grid_voltage
            name: Grid voltage
          - type: tile
            entity: sensor.pi30_heat_sink_temperature
            name: Heat sink temperature
      - type: grid
        cards:
          - type: heading
            heading: Battery management
          - type: entities
            title: Battery management
            show_header_toggle: false
            state_color: true
            entities:
              - entity: script.pi30_batteria_da_caricare
                name: 'CHARGE: output from grid, charge solar + grid'
              - entity: script.pi30_batteria_da_scaricare
                name: 'DISCHARGE and HOLD: SBU output, then battery held at the minimum voltage'
              - &id001
                type: divider
              - entity: input_number.pi30_keep_battery_live
                name: Minimum voltage to hold
              - entity: input_number.pi30_bulk_carica
                name: Bulk while charging
              - entity: input_number.pi30_float_carica
                name: Float while charging
              - *id001
              - entity: automation.pi30_soc_batteria
                name: Battery SOC automation
              - entity: script.pi30_soc_ricalibra_da_tensione
                name: Recalibrate SOC from voltage (once)
              - entity: input_number.pi30_battery_soc_calculated
                name: Calculated SOC (raw value)
              - entity: sensor.pi30_battery_soc
                name: Inverter SOC (from voltage)
          - type: entities
            title: Battery energy
            show_header_toggle: false
            state_color: true
            entities:
              - entity: sensor.pi30_battery_charge_energy_today
                name: Charged today
              - entity: sensor.pi30_battery_discharge_energy_today
                name: Discharged today
              - entity: sensor.pi30_battery_charge_energy
                name: Charged in total
              - entity: sensor.pi30_battery_discharge_energy
                name: Discharged in total
              - *id001
              - entity: sensor.pi30_battery_charge_power
                name: Charge power
              - entity: sensor.pi30_battery_discharge_power
                name: Discharge power
              - entity: sensor.pi30_battery_current
                name: Battery current
      - type: grid
        cards:
          - type: heading
            heading: Last 24 hours
          - type: history-graph
            title: Last 24 hours
            hours_to_show: 24
            entities:
              - entity: sensor.pi30_battery_soc_calculated
                name: Battery SOC (energy counting)
              - entity: sensor.pi30_battery_voltage
                name: Battery voltage
            grid_options:
              columns: 12
          - type: history-graph
            title: Power, last 24 hours
            hours_to_show: 24
            entities:
              - entity: sensor.pi30_battery_power
                name: Battery power
              - entity: sensor.pi30_pv_power
                name: Solar power
              - entity: sensor.pi30_output_active_power
                name: Output power
            grid_options:
              columns: 12
          - type: logbook
            title: Mode changes
            hours_to_show: 48
            target:
              entity_id:
                - sensor.pi30_device_mode
            grid_options:
              columns: 12
              rows: 6
      - type: grid
        cards:
          - type: entities
            title: Output priority (POP)
            show_header_toggle: false
            state_color: true
            entities:
              - entity: sensor.pi30_output_source_priority
                name: Priority read from the inverter
              - *id001
              - entity: switch.pi30_output_priority_utility
                name: 0 Utility first (USB)
              - entity: switch.pi30_output_priority_solar
                name: 1 Solar first (SUB)
              - entity: switch.pi30_output_priority_sbu
                name: 2 SBU
          - type: entities
            title: Charger priority (PCP)
            show_header_toggle: false
            state_color: true
            entities:
              - entity: sensor.pi30_charger_source_priority
                name: Priority read from the inverter
              - *id001
              - entity: button.pi30_charger_solar_first
                name: 1 Solar first
              - entity: button.pi30_charger_solar_utility
                name: 2 Solar + utility
              - entity: button.pi30_charger_solar_only
                name: 3 Solar only
          - type: entities
            title: Inverter status
            show_header_toggle: false
            state_color: true
            entities:
              - entity: sensor.pi30_device_mode
                name: Device mode
              - entity: binary_sensor.pi30_load_on
                name: Load on
              - entity: binary_sensor.pi30_charging
                name: Charging
              - entity: binary_sensor.pi30_ac_charging
                name: Grid charging
              - entity: binary_sensor.pi30_scc_charging
                name: Solar charging
              - entity: binary_sensor.pi30_charging_to_floating_mode
                name: Float
      - type: grid
        cards:
          - type: entities
            title: Battery settings
            show_header_toggle: false
            state_color: true
            entities:
              - entity: select.pi30_set_max_total_charging_current
                name: Max total charging current (set)
              - entity: sensor.pi30_max_total_charging_current
                name: Max total charging current (read)
              - entity: select.pi30_set_max_utility_charging_current
                name: Max grid charging current (set)
              - entity: sensor.pi30_max_utility_charging_current
                name: Max grid charging current (read)
              - *id001
              - entity: number.pi30_set_battery_bulk_voltage
                name: Bulk / C.V. (PCVV) (set)
              - entity: sensor.pi30_battery_bulk_voltage
                name: Bulk / C.V. (PCVV) (read)
              - entity: number.pi30_set_battery_float_voltage
                name: Float (PBFT) (set)
              - entity: sensor.pi30_battery_float_voltage
                name: Float (PBFT) (read)
              - *id001
              - entity: number.pi30_set_battery_recharge_voltage
                name: Back to grid (PBCV) (set)
              - entity: sensor.pi30_battery_recharge_voltage
                name: Back to grid (PBCV) (read)
              - entity: number.pi30_set_battery_redischarge_voltage
                name: Back to battery (PBDV) (set)
              - entity: sensor.pi30_battery_redischarge_voltage
                name: Back to battery (PBDV) (read)
              - entity: number.pi30_set_battery_under_voltage
                name: Battery cut-off (PSDV) (set)
              - entity: sensor.pi30_battery_under_voltage
                name: Battery cut-off (PSDV) (read)
          - type: entities
            title: Configuration
            show_header_toggle: false
            state_color: true
            entities:
              - entity: switch.pi30_input_voltage_range_ups
                name: Input range UPS 170-280V (OFF = APL 90-280V)
              - entity: switch.pi30_pv_power_balance
                name: 'Power balance (PSPB): ON more self-consumption, OFF protects the battery'
              - entity: switch.pi30_pv_ok_condition_for_parallel
                name: Parallel inverters
          - type: entities
            title: Command console
            show_header_toggle: false
            state_color: true
            entities:
              - entity: text.pi30_manual_command
                name: Command (no CRC)
              - entity: button.pi30_send_manual_command
                name: Send
      - type: grid
        cards:
          - type: entities
            title: Inverter
            show_header_toggle: false
            state_color: true
            entities:
              - entity: sensor.pi30_grid_voltage
                name: Grid voltage
              - entity: sensor.pi30_grid_frequency
                name: Grid frequency
              - entity: sensor.pi30_output_voltage
                name: Output voltage
              - entity: sensor.pi30_output_frequency
                name: Output frequency
              - entity: sensor.pi30_output_apparent_power
                name: Output apparent power
              - entity: sensor.pi30_output_active_power
                name: Output power
              - entity: sensor.pi30_load_percent
                name: Load
              - entity: sensor.pi30_bus_voltage
                name: Bus voltage
              - *id001
              - entity: sensor.pi30_battery_voltage
                name: Battery voltage
              - entity: sensor.pi30_battery_charging_current
                name: Charging current
              - entity: sensor.pi30_battery_discharge_current
                name: Discharge current
              - entity: sensor.pi30_heat_sink_temperature
                name: Heat sink temperature
              - *id001
              - entity: sensor.pi30_pv_voltage
                name: Solar voltage
              - entity: sensor.pi30_pv_current
                name: Solar current
              - entity: sensor.pi30_pv_power
                name: Solar power
          - type: entities
            title: ESP32
            show_header_toggle: false
            state_color: true
            entities:
              - entity: binary_sensor.pi30_switch_on
                name: Inverter on
              - *id001
              - entity: sensor.pi30_ip_address
                name: IP address
              - entity: sensor.pi30_wifi_ssid
                name: SSID
              - entity: sensor.pi30_wifi_bssid
                name: BSSID
              - entity: sensor.pi30_wifi_signal
                name: WiFi signal dBm
              - entity: sensor.pi30_wifi_signal_percent
                name: WiFi signal %
      - type: grid
        cards:
          - type: entities
            title: Read commands
            show_header_toggle: false
            state_color: true
            entities:
              - entity: button.pi30_refresh_now
                name: Refresh now (QPIRI / QPIGS / QMOD)
              - *id001
              - entity: button.pi30_qpi_protocol
                name: QPI - protocol
              - entity: button.pi30_qid_serial_number
                name: QID - serial number
              - entity: button.pi30_qvfw_firmware
                name: QVFW - firmware
              - entity: button.pi30_qdi_defaults
                name: QDI - defaults
              - entity: button.pi30_qmchgcr_charging_currents
                name: QMCHGCR - allowed charging currents
              - entity: button.pi30_qmuchgcr_utility_charging_currents
                name: QMUCHGCR - allowed grid charging currents
          - type: entities
            title: Raw data
            show_header_toggle: false
            state_color: true
            entities:
              - entity: switch.pi30_raw_frame_capture
                name: Raw frame capture
              - entity: sensor.pi30_last_tx
                name: Sent
              - entity: sensor.pi30_last_rx
                name: Received
          - type: entities
            title: Polling replies
            show_header_toggle: false
            state_color: true
            entities:
              - entity: sensor.pi30_last_qpiri
                name: QPIRI
              - entity: sensor.pi30_last_qpigs
                name: QPIGS
              - entity: sensor.pi30_last_qmod
                name: QMOD
