# Dashboard generica per l'inverter PI30 con il firmware di questo repository
# (examples/esp32/heltec-pi30), senza GoodWe: inverter e la sua batteria.
# Usa gli script e gli aiutanti di "home_assistant/automations/PI30 battery
# management" (CARICA e SCARICA/MANTIENI a mano) e l'automazione di
# "home_assistant/automations/PI30 battery SOC". Le righe di cui non hai creato
# l'entità compaiono come "Entità non trovata": cancellale o crea l'entità.
# Per importarla: Impostazioni > Dashboard > Aggiungi dashboard > Nuova
# dashboard da zero, aprila, matita in alto a destra, tre puntini > Editor di
# configurazione, sostituisci tutto con questo file e salva. Per aggiungerla
# come vista a una dashboard che hai già, copia solo il blocco sotto "views:".
title: Inverter PI30
views:
  - type: sections
    title: Inverter PI30
    path: inverter
    icon: mdi:solar-power-variant
    max_columns: 4
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Panoramica
          - type: gauge
            entity: sensor.pi30_battery_soc_calculated
            name: SOC batteria (conteggio energia)
            min: 0
            max: 100
            needle: true
            severity:
              red: 0
              yellow: 15
              green: 40
          - type: tile
            entity: sensor.pi30_device_mode
            name: Modo di funzionamento
          - type: tile
            entity: sensor.pi30_battery_voltage
            name: Tensione batteria
          - type: tile
            entity: sensor.pi30_battery_power
            name: Potenza batteria
          - type: tile
            entity: sensor.pi30_pv_power
            name: Potenza solare
          - type: tile
            entity: sensor.pi30_output_active_power
            name: Potenza in uscita
          - type: tile
            entity: sensor.pi30_grid_voltage
            name: Tensione rete
          - type: tile
            entity: sensor.pi30_heat_sink_temperature
            name: Temperatura dissipatore
      - type: grid
        cards:
          - type: heading
            heading: Gestione batteria
          - type: entities
            title: Gestione batteria
            show_header_toggle: false
            state_color: true
            entities:
              - entity: script.pi30_battery_charge
                name: 'CARICA: uscita da rete, carica solare + rete'
              - entity: script.pi30_battery_discharge
                name: 'SCARICA e MANTIENI: uscita SBU, poi batteria tenuta alla tensione minima'
              - &id001
                type: divider
              - entity: input_number.pi30_keep_battery_live
                name: Tensione minima da mantenere
              - entity: input_number.pi30_charge_bulk_voltage
                name: Bulk in carica
              - entity: input_number.pi30_charge_float_voltage
                name: Float in carica
              - *id001
              - entity: automation.pi30_battery_soc_coulomb_counting
                name: Automazione SOC batteria
              - entity: script.pi30_battery_soc_recalibrate
                name: Ricalibra SOC da tensione (una volta)
              - entity: input_number.pi30_battery_soc_calculated
                name: SOC calcolato (valore grezzo)
              - entity: sensor.pi30_battery_soc
                name: SOC dell'inverter (da tensione)
          - type: entities
            title: Energia batteria
            show_header_toggle: false
            state_color: true
            entities:
              - entity: sensor.pi30_battery_charge_energy_today
                name: Caricata oggi
              - entity: sensor.pi30_battery_discharge_energy_today
                name: Scaricata oggi
              - entity: sensor.pi30_battery_charge_energy
                name: Caricata in totale
              - entity: sensor.pi30_battery_discharge_energy
                name: Scaricata in totale
              - *id001
              - entity: sensor.pi30_battery_charge_power
                name: Potenza di carica
              - entity: sensor.pi30_battery_discharge_power
                name: Potenza di scarica
              - entity: sensor.pi30_battery_current
                name: Corrente batteria
      - type: grid
        cards:
          - type: heading
            heading: Ultime 24 ore
          - type: history-graph
            title: Ultime 24 ore
            hours_to_show: 24
            entities:
              - entity: sensor.pi30_battery_soc_calculated
                name: SOC batteria (conteggio energia)
              - entity: sensor.pi30_battery_voltage
                name: Tensione batteria
            grid_options:
              columns: 12
          - type: history-graph
            title: Potenze, ultime 24 ore
            hours_to_show: 24
            entities:
              - entity: sensor.pi30_battery_power
                name: Potenza batteria
              - entity: sensor.pi30_pv_power
                name: Potenza solare
              - entity: sensor.pi30_output_active_power
                name: Potenza in uscita
            grid_options:
              columns: 12
          - type: logbook
            title: Cambi di modo
            hours_to_show: 48
            target:
              entity_id:
                - sensor.pi30_device_mode
            grid_options:
              columns: 12
              rows: 6
      - type: grid
        cards:
          - type: entities
            title: Priorità uscita (POP)
            show_header_toggle: false
            state_color: true
            entities:
              - entity: sensor.pi30_output_source_priority
                name: Priorità letta dall'inverter
              - *id001
              - entity: switch.pi30_output_priority_utility
                name: 0 Rete prima (USB)
              - entity: switch.pi30_output_priority_solar
                name: 1 Solare prima (SUB)
              - entity: switch.pi30_output_priority_sbu
                name: 2 SBU
          - type: entities
            title: Priorità carica (PCP)
            show_header_toggle: false
            state_color: true
            entities:
              - entity: sensor.pi30_charger_source_priority
                name: Priorità letta dall'inverter
              - *id001
              - entity: button.pi30_charger_solar_first
                name: 1 Solare prima
              - entity: button.pi30_charger_solar_utility
                name: 2 Solare + rete
              - entity: button.pi30_charger_solar_only
                name: 3 Solo solare
          - type: entities
            title: Stato inverter
            show_header_toggle: false
            state_color: true
            entities:
              - entity: sensor.pi30_device_mode
                name: Modo di funzionamento
              - entity: binary_sensor.pi30_load_on
                name: Carico attivo
              - entity: binary_sensor.pi30_charging
                name: In carica
              - entity: binary_sensor.pi30_ac_charging
                name: Carica da rete
              - entity: binary_sensor.pi30_scc_charging
                name: Carica da solare
              - entity: binary_sensor.pi30_charging_to_floating_mode
                name: In float
      - type: grid
        cards:
          - type: entities
            title: Impostazioni batteria
            show_header_toggle: false
            state_color: true
            entities:
              - entity: select.pi30_set_max_total_charging_current
                name: Corrente max di carica totale (imposta)
              - entity: sensor.pi30_max_total_charging_current
                name: Corrente max di carica totale (letta)
              - entity: select.pi30_set_max_utility_charging_current
                name: Corrente max di carica da rete (imposta)
              - entity: sensor.pi30_max_utility_charging_current
                name: Corrente max di carica da rete (letta)
              - *id001
              - entity: number.pi30_set_battery_bulk_voltage
                name: Bulk / C.V. (PCVV) (imposta)
              - entity: sensor.pi30_battery_bulk_voltage
                name: Bulk / C.V. (PCVV) (letta)
              - entity: number.pi30_set_battery_float_voltage
                name: Float (PBFT) (imposta)
              - entity: sensor.pi30_battery_float_voltage
                name: Float (PBFT) (letta)
              - *id001
              - entity: number.pi30_set_battery_recharge_voltage
                name: Ritorno alla rete (PBCV) (imposta)
              - entity: sensor.pi30_battery_recharge_voltage
                name: Ritorno alla rete (PBCV) (letta)
              - entity: number.pi30_set_battery_redischarge_voltage
                name: Ritorno alla batteria (PBDV) (imposta)
              - entity: sensor.pi30_battery_redischarge_voltage
                name: Ritorno alla batteria (PBDV) (letta)
              - entity: number.pi30_set_battery_under_voltage
                name: Stacco batteria (PSDV) (imposta)
              - entity: sensor.pi30_battery_under_voltage
                name: Stacco batteria (PSDV) (letta)
          - type: entities
            title: Configurazione
            show_header_toggle: false
            state_color: true
            entities:
              - entity: switch.pi30_input_voltage_range_ups
                name: Range ingresso UPS 170-280V (OFF = APL 90-280V)
              - entity: switch.pi30_pv_power_balance
                name: 'Power balance (PSPB): ON più autoconsumo, OFF protegge la batteria'
              - entity: switch.pi30_pv_ok_condition_for_parallel
                name: Inverter in parallelo
          - type: entities
            title: Console comandi
            show_header_toggle: false
            state_color: true
            entities:
              - entity: text.pi30_manual_command
                name: Comando (senza CRC)
              - entity: button.pi30_send_manual_command
                name: Invia
      - type: grid
        cards:
          - type: entities
            title: Inverter
            show_header_toggle: false
            state_color: true
            entities:
              - entity: sensor.pi30_grid_voltage
                name: Tensione rete
              - entity: sensor.pi30_grid_frequency
                name: Frequenza rete
              - entity: sensor.pi30_output_voltage
                name: Tensione uscita
              - entity: sensor.pi30_output_frequency
                name: Frequenza uscita
              - entity: sensor.pi30_output_apparent_power
                name: Potenza apparente uscita
              - entity: sensor.pi30_output_active_power
                name: Potenza in uscita
              - entity: sensor.pi30_load_percent
                name: Carico
              - entity: sensor.pi30_bus_voltage
                name: Tensione bus
              - *id001
              - entity: sensor.pi30_battery_voltage
                name: Tensione batteria
              - entity: sensor.pi30_battery_charging_current
                name: Corrente di carica
              - entity: sensor.pi30_battery_discharge_current
                name: Corrente di scarica
              - entity: sensor.pi30_heat_sink_temperature
                name: Temperatura dissipatore
              - *id001
              - entity: sensor.pi30_pv_voltage
                name: Tensione solare
              - entity: sensor.pi30_pv_current
                name: Corrente solare
              - entity: sensor.pi30_pv_power
                name: Potenza solare
          - type: entities
            title: ESP32
            show_header_toggle: false
            state_color: true
            entities:
              - entity: binary_sensor.pi30_switch_on
                name: Inverter acceso
              - *id001
              - entity: sensor.pi30_ip_address
                name: Indirizzo IP
              - entity: sensor.pi30_wifi_ssid
                name: SSID
              - entity: sensor.pi30_wifi_bssid
                name: BSSID
              - entity: sensor.pi30_wifi_signal
                name: Segnale WiFi dBm
              - entity: sensor.pi30_wifi_signal_percent
                name: Segnale WiFi %
      - type: grid
        cards:
          - type: entities
            title: Comandi di lettura
            show_header_toggle: false
            state_color: true
            entities:
              - entity: button.pi30_refresh_now
                name: Aggiorna adesso (QPIRI / QPIGS / QMOD)
              - *id001
              - entity: button.pi30_qpi_protocol
                name: QPI - protocollo
              - entity: button.pi30_qid_serial_number
                name: QID - numero di serie
              - entity: button.pi30_qvfw_firmware
                name: QVFW - firmware
              - entity: button.pi30_qdi_defaults
                name: QDI - valori di default
              - entity: button.pi30_qmchgcr_charging_currents
                name: QMCHGCR - correnti di carica ammesse
              - entity: button.pi30_qmuchgcr_utility_charging_currents
                name: QMUCHGCR - correnti da rete ammesse
          - type: entities
            title: Dati grezzi
            show_header_toggle: false
            state_color: true
            entities:
              - entity: switch.pi30_raw_frame_capture
                name: Cattura dati grezzi
              - entity: sensor.pi30_last_tx
                name: Inviato
              - entity: sensor.pi30_last_rx
                name: Ricevuto
          - type: entities
            title: Risposte del polling
            show_header_toggle: false
            state_color: true
            entities:
              - entity: sensor.pi30_last_qpiri
                name: QPIRI
              - entity: sensor.pi30_last_qpigs
                name: QPIGS
              - entity: sensor.pi30_last_qmod
                name: QMOD
